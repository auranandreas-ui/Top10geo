<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Geo — Daily Geography Trivia</title>

<style>
  :root{
    --bg:#0f172a;
    --bg-soft:#111c34;
    --card:#16213e;
    --card-2:#1b2a4a;
    --accent:#38bdf8;
    --accent-2:#22d3ee;
    --gold:#fbbf24;
    --green:#34d399;
    --red:#f87171;
    --text:#e2e8f0;
    --text-dim:#94a3b8;
    --border:#26375c;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at top, #17264a 0%, var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:40px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    position:sticky;
    top:0;
    background:rgba(15,23,42,0.9);
    backdrop-filter:blur(6px);
    z-index:10;
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:18px;
    cursor:pointer;
  }
  .brand .globe{font-size:22px;}
  .stat-pills{display:flex;gap:8px;}
  .pill{
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 10px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:4px;
    white-space:nowrap;
  }
  .pill.gold{color:var(--gold);}
  main{padding:18px 20px;flex:1;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{margin:0 0 6px;font-size:18px;}
  .card p.sub{color:var(--text-dim);font-size:14px;margin:0 0 14px;line-height:1.5;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04202e;}
  .btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3a2400;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:10px;}
  .badge{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    display:inline-block;
  }
  .badge.easy{background:rgba(52,211,153,.15);color:var(--green);}
  .badge.medium{background:rgba(251,191,36,.15);color:var(--gold);}
  .badge.hard{background:rgba(248,113,113,.15);color:var(--red);}
  .badge.expert{background:rgba(167,139,250,.15);color:#a78bfa;}
  .badge.locked{background:rgba(148,163,184,.15);color:var(--text-dim);}
  .duel-card{
    flex:1;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    text-align:center;
    background:var(--card-2);
  }
  .duel-card.winner{border-color:var(--gold);background:rgba(251,191,36,.08);}
  .duel-score{font-size:28px;font-weight:800;margin:4px 0;}
  .nav-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .nav-tabs button{
    flex:1;
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:10px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .nav-tabs button.active{background:var(--accent);color:#04202e;border-color:var(--accent);}
  .cat-list{display:flex;flex-direction:column;gap:10px;}
  .cat-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    cursor:pointer;
  }
  .cat-item.locked{opacity:.55;cursor:default;}
  .cat-item .name{font-size:14px;font-weight:600;}
  .lives{display:flex;gap:4px;font-size:18px;}
  .life.lost{opacity:.25;filter:grayscale(1);}
  .slots{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:16px 0;
  }
  .slot{
    background:var(--card-2);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    min-height:20px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .slot.filled{
    border-style:solid;
    border-color:var(--green);
    background:rgba(52,211,153,.08);
    font-weight:600;
  }
  .slot .rank{
    color:var(--text-dim);
    font-weight:700;
    min-width:18px;
  }
  .slot.filled .rank{color:var(--green);}
  .guess-row{display:flex;gap:8px;margin-top:10px;}
  input[type=text]{
    flex:1;
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  .feedback{
    margin-top:10px;
    font-size:14px;
    min-height:20px;
    font-weight:600;
  }
  .feedback.ok{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .progress-bar{
    height:6px;
    background:var(--card-2);
    border-radius:999px;
    overflow:hidden;
    margin-top:10px;
  }
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));}
  .fact-box{
    background:rgba(56,189,248,.08);
    border:1px solid rgba(56,189,248,.25);
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    color:var(--text-dim);
    margin-top:14px;
  }
  .fact-box b{color:var(--accent);}
  .lock-overlay{
    text-align:center;
    padding:30px 10px;
  }
  .lock-overlay .icon{font-size:34px;margin-bottom:6px;}
  .plans{display:flex;flex-direction:column;gap:12px;margin:16px 0;}
  .plan{
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    background:var(--card-2);
  }
  .plan.featured{border-color:var(--gold);background:rgba(251,191,36,.06);}
  .plan .price{font-size:22px;font-weight:800;margin:2px 0 8px;}
  .plan .price span{font-size:13px;color:var(--text-dim);font-weight:500;}
  .plan ul{margin:0;padding-left:18px;font-size:13px;color:var(--text-dim);line-height:1.7;}
  footer.note{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    padding:14px 20px 0;
  }
  .center{text-align:center;}
  .hidden{display:none !important;}
  .streak-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);margin-bottom:12px;}
  .divider{height:1px;background:var(--border);margin:16px 0;}
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--card-2);
    border:1px solid var(--accent);
    color:var(--text);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
  .pill.mute-btn{cursor:pointer;user-select:none;}
  .guess-wrap{position:relative;}
  .suggestions{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    z-index:20;
    box-shadow:0 10px 24px rgba(0,0,0,.35);
  }
  .suggestions .sug-item{
    padding:10px 14px;
    font-size:14px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .suggestions .sug-item:last-child{border-bottom:none;}
  .suggestions .sug-item:hover, .suggestions .sug-item.active{background:rgba(56,189,248,.12);}
  .hint-row{display:flex;gap:8px;margin-top:10px;}
  .ad-free-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--green);
    background:rgba(52,211,153,.1);
    border:1px solid rgba(52,211,153,.3);
    padding:4px 10px;
    border-radius:999px;
    margin-top:8px;
  }
</style>
</head>

/* =========================================================
   SOUND EFFECTS (synthesized, no audio files needed)
   ========================================================= */
const AudioFX = (function(){
  let ctx = null;
  let muted = localStorage.getItem("top10geo_muted") === "1";
  function getCtx(){
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, duration, type, gain, delay){
    if(muted) return;
    try{
      const c = getCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      osc.connect(g); g.connect(c.destination);
      const t0 = c.currentTime + (delay || 0);
      g.gain.setValueAtTime(gain || 0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.start(t0);
      osc.stop(t0 + duration + 0.03);
    }catch(e){ /* audio not available — fail silently */ }
  }
  return {
    correct(){ tone(880,0.12,"sine",0.18,0); tone(1318.5,0.16,"sine",0.14,0.08); },
    wrong(){ tone(180,0.28,"sawtooth",0.14,0); },
    click(){ tone(500,0.05,"square",0.06,0); },
    win(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.18,"sine",0.16,i*0.09)); },
    lose(){ tone(220,0.3,"sawtooth",0.12,0); tone(170,0.35,"sawtooth",0.12,0.15); },
    hint(){ tone(660,0.1,"triangle",0.12,0); },
    toggleMute(){
      muted = !muted;
      localStorage.setItem("top10geo_muted", muted ? "1" : "0");
      return muted;
    },
    isMuted(){ return muted; }
  };
})();
function toggleMute(){
  const nowMuted = AudioFX.toggleMute();
  renderMuteBtn();
  if(!nowMuted) AudioFX.click();
}
function renderMuteBtn(){
  const btn = document.getElementById("muteBtn");
  if(btn) btn.textContent = AudioFX.isMuted() ? "🔇" : "🔊";
}

const STORAGE_KEY = "top10geo_state_v1";
const FREE_DAILY_PRACTICE_LIMIT = 3;   // non-daily rounds free players get per day
const PREMIUM_SCORE_MULTIPLIER = 1.25;  // real, functional premium perk
const STREAK_MILESTONES = { 3: 15, 7: 40, 14: 80, 30: 200, 50: 400, 100: 1000 };
const LEVEL_TITLES = ["Map Rookie","Trail Finder","Globetrotter","Explorer","Navigator","Cartographer","Geo Master","World Sage","Atlas Legend","Globe Grandmaster"];
function defaultState(){
  return {
    score: 0,
    streak: 0,
    bestStreak: 0,
    premium: false,
    trialActive: false,
    trialUsed: false,
    trialEndsAt: null,
    lifetime: false,
    dailyDate: null,
    dailyQuestionId: null,
    dailyCompleted: false,
    playedIds: [],
    practiceDate: null,
    practiceCount: 0,
    lastSeenLevel: 1,
    shieldDate: null,
    history: [],
    duelRecord: { p1Wins: 0, p2Wins: 0, ties: 0 },
    seenBadges: []
  };
}
const CONTINENTS = ["Africa","Asia","Europe","North America","South America","Oceania"];
function getCompletedQuestionIds(){
  const set = new Set();
  state.history.forEach(h => { if(h.completedAll) set.add(h.questionId); });
  return set;
}
function getEarnedBadges(){
  const completed = getCompletedQuestionIds();
  const badges = [];
  CONTINENTS.forEach(c=>{
    const ids = QUESTIONS.filter(q=>q.continent===c).map(q=>q.id);
    if(ids.length && ids.every(id=>completed.has(id))){
      badges.push({ id: "continent-"+c, icon: "🌍", label: c+" Master" });
    }
  });
  if(CONTINENTS.every(c => badges.some(b=>b.id==="continent-"+c))){
    badges.push({ id: "world-tour", icon: "🌐", label: "Full World Tour" });
  }
  const gkIds = QUESTIONS.filter(q=>(q.topic||"geography")==="general").map(q=>q.id);
  if(gkIds.length && gkIds.every(id=>completed.has(id))){
    badges.push({ id: "gk-guru", icon: "🎉", label: "General Knowledge Guru" });
  }
  const expertIds = QUESTIONS.filter(q=>q.difficulty==="expert").map(q=>q.id);
  if(expertIds.length && expertIds.every(id=>completed.has(id))){
    badges.push({ id: "expert-master", icon: "🟣", label: "Expert Tier Master" });
  }
  return badges;
}
function getAllBadgeDefs(){
  const defs = CONTINENTS.map(c => ({ id: "continent-"+c, icon: "🌍", label: c+" Master" }));
  defs.push({ id: "world-tour", icon: "🌐", label: "Full World Tour" });
  defs.push({ id: "gk-guru", icon: "🎉", label: "General Knowledge Guru" });
  defs.push({ id: "expert-master", icon: "🟣", label: "Expert Tier Master" });
  return defs;
}
function getLevelInfo(score){
  const level = Math.floor(Math.sqrt(Math.max(0,score) / 40)) + 1;
  const title = LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)];
  const currentFloor = Math.pow(level - 1, 2) * 40;
  const nextFloor = Math.pow(level, 2) * 40;
  const progress = nextFloor > currentFloor ? (score - currentFloor) / (nextFloor - currentFloor) : 1;
  return { level, title, currentFloor, nextFloor, progress: Math.max(0, Math.min(1, progress)) };
}
function practiceBonusForLevel(level){
  return Math.min(5, Math.floor((level - 1) / 2)); // +1 every 2 levels, capped at +5
}
function nextPracticeBonusLevel(level){
  const currentBonus = practiceBonusForLevel(level);
  if(currentBonus >= 5) return null; // maxed out
  for(let l = level + 1; l <= 11; l++){
    if(practiceBonusForLevel(l) > currentBonus) return l;
  }
  return null;
}
function addScore(basePoints){
  const amount = Math.round(basePoints * (state.premium ? PREMIUM_SCORE_MULTIPLIER : 1));
  state.score += amount;
  checkLevelUp();
  return amount;
}
function checkLevelUp(){
  const info = getLevelInfo(state.score);
  if(info.level > state.lastSeenLevel){
    const prevBonus = practiceBonusForLevel(state.lastSeenLevel);
    const newBonus = practiceBonusForLevel(info.level);
    state.lastSeenLevel = info.level;
    const unlockMsg = newBonus > prevBonus ? ` +${newBonus} daily practice rounds unlocked!` : "";
    showToast(`🎉 Level up! You're now Lv.${info.level} — ${info.title}.${unlockMsg}`);
    AudioFX.win();
  }
}
function streakShieldAvailable(){
  return state.premium && state.shieldDate !== todayStr();
}
function checkTrialExpiry(){
  if(state.trialActive && state.trialEndsAt && Date.now() > state.trialEndsAt){
    state.trialActive = false;
    state.premium = false;
    saveState();
    showToast("⏰ Your free trial has ended");
  }
}
let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    return Object.assign(defaultState(), JSON.parse(raw));
  }catch(e){ return defaultState(); }
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  renderPills();
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function dayOfYear(){
  const d = new Date();
  const start = new Date(d.getFullYear(),0,0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}
function getDailyQuestion(){
  const idx = dayOfYear() % QUESTIONS.length;
  return QUESTIONS[idx];
}
function ensurePracticeDay(){
  if(state.practiceDate !== todayStr()){
    state.practiceDate = todayStr();
    state.practiceCount = 0;
  }
}
function effectivePracticeLimit(){
  return FREE_DAILY_PRACTICE_LIMIT + practiceBonusForLevel(getLevelInfo(state.score).level);
}
function practiceRemaining(){
  ensurePracticeDay();
  return Math.max(0, effectivePracticeLimit() - state.practiceCount);
}

/* =========================================================
   BACKEND (Supabase auth + Stripe payments via /api routes)
   Fill in supabaseUrl / supabaseAnonKey below once you've
   deployed the webapp/ folder (see webapp/DEPLOY.md). Until
   then backendEnabled stays false and the whole game runs
   exactly like the original local-only prototype — nothing
   here changes offline play.
   Once configured: signed-out visitors and anyone without a
   deployed backend still play locally and instantly. Signed-in
   players get their score/streak/premium synced with the real
   database, and Premium purchases go through actual Stripe
   Checkout instead of the local "simulate" buttons.
   ========================================================= */
const BACKEND = {
  supabaseUrl: "",     // e.g. "https://xxxxx.supabase.co"
  supabaseAnonKey: ""  // Supabase project's public "anon" key (safe to expose)
};
const backendEnabled = !!(BACKEND.supabaseUrl && BACKEND.supabaseAnonKey);
let sb = null;
let authSession = null;
if(backendEnabled && window.supabase){
  sb = window.supabase.createClient(BACKEND.supabaseUrl, BACKEND.supabaseAnonKey);
}

async function apiFetch(path, opts){
  opts = opts || {};
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if(authSession && authSession.access_token){
    headers["Authorization"] = "Bearer " + authSession.access_token;
  }
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  let data = null;
  try{ data = await res.json(); }catch(e){ /* no body */ }
  if(!res.ok){
    const err = new Error((data && data.error) || ("Request failed (" + res.status + ")"));
    err.status = res.status;
    throw err;
  }
  return data;
}

function applyServerProfile(p){
  if(!p) return;
  state.score = p.score;
  state.streak = p.streak;
  state.bestStreak = p.best_streak;
  state.premium = p.premium;
  state.trialUsed = p.trial_used;
  state.trialActive = p.premium_source === "trial";
  state.trialEndsAt = p.trial_ends_at ? new Date(p.trial_ends_at).getTime() : null;
  state.lifetime = p.lifetime;
  state.shieldDate = p.shield_date;
  state.practiceDate = p.practice_date;
  state.practiceCount = p.practice_count;
  state.lastSeenLevel = p.last_seen_level;
  saveState();
}

async function syncProfileFromServer(){
  if(!backendEnabled || !authSession) return;
  try{
    const { profile } = await apiFetch("/api/me");
    applyServerProfile(profile);
  }catch(e){ /* deployed but unreachable, or profile still provisioning — keep local state */ }
}

async function sendMagicLink(email){
  if(!sb || !email) return;
  try{
    await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
    showToast("📬 Check " + email + " for a sign-in link");
  }catch(e){
    showToast("Couldn't send link: " + e.message);
  }
}
async function signOut(){
  if(!sb) return;
  await sb.auth.signOut();
  authSession = null;
  showToast("Signed out");
  renderPremium();
}
async function initAuth(){
  if(!backendEnabled || !sb) return;
  const { data } = await sb.auth.getSession();
  authSession = data && data.session;
  sb.auth.onAuthStateChange((_event, session) => {
    const justSignedIn = !authSession && session;
    authSession = session;
    syncProfileFromServer().then(() => { if(justSignedIn) renderPremium(); });
  });
  if(authSession) await syncProfileFromServer();
}

/* =========================================================
   HELPERS
   ========================================================= */
function normalize(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/^\s*the\s+/,"")
    .replace(/[^a-z0-9]/g,"");
}
function buildAliasSet(answerName){
  const set = new Set();
  set.add(normalize(answerName));
  const key = answerName.toLowerCase();
  if(ALIASES[key]){
    ALIASES[key].forEach(a => set.add(normalize(a)));
  }
  return set;
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}
function renderPills(){
  document.getElementById("pillStreak").textContent = state.streak;
  const info = getLevelInfo(state.score);
  document.getElementById("pillScore").textContent = `${state.score} · Lv${info.level}`;
  const p = document.getElementById("pillPremium");
  p.textContent = state.premium ? "★ Premium" : "Free";
  p.style.color = state.premium ? "#fbbf24" : "";
}

  let html = `<div class="card">

    });
    html += `</div></div>`;

/* =========================================================
   GAME ROUND
   ========================================================= */
let roundState = null;
let duelState = null;
function startRound(questionId, isDaily, duelCtx){
  const q = QUESTIONS.find(x=>x.id===questionId);
  if(!q) return;
  if(!duelCtx && !isDaily && !state.premium){
    if(practiceRemaining() <= 0){
      showToast("🎟️ Out of free practice rounds for today");
      renderPremium();
      return;
    }
    state.practiceCount++;
    saveState();
  }
  roundState = {
    question: q,
    isDaily: isDaily,
    duel: duelCtx || null,
    startedAt: Date.now(),
    lives: 5,
    found: new Array(q.answers.length).fill(null),
    foundCount: 0,
    wrongGuesses: new Set(),
    over: false
  };
  renderRound();
}

function renderRound(){
  const rs = roundState;
  const q = rs.question;
  const heartsHtml = Array.from({length:5}).map((_,i)=>
    `<span class="life ${i < rs.lives ? '' : 'lost'}">❤️</span>`
  ).join("");

  const slotsHtml = q.answers.map((ans, i)=>{
    const val = rs.found[i];
    return `<div class="slot ${val ? 'filled':''}">
      <span class="rank">${q.ranked ? (i+1) : '•'}</span>
      <span>${val ? "✅ "+val : '?'}</span>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <span class="badge ${q.difficulty}">${LEVEL_ICON[q.difficulty]||''} ${q.difficulty}</span>
        <div class="lives">${heartsHtml}</div>
      </div>
      ${rs.duel ? `<div class="badge expert" style="margin-top:8px;">⚔️ Player ${rs.duel.player}'s turn</div>` : ''}
      <h2 style="margin-top:10px;">${q.icon || "🌍"} ${q.title}</h2>
      <p class="sub">${q.prompt}</p>
      <div class="progress-bar"><div style="width:${(rs.foundCount/q.answers.length)*100}%"></div></div>
      <div class="slots">${slotsHtml}</div>
      <div class="guess-wrap">
        <form class="guess-row" onsubmit="submitGuess(event)" autocomplete="off">
          <input type="text" id="guessInput" placeholder="🔎 Type a country / answer…" autocomplete="off" autofocus
            oninput="handleTypeahead(this.value)" onblur="hideSuggestionsSoon()" onfocus="handleTypeahead(this.value)">
          <button class="btn btn-primary" type="submit">Guess</button>
        </form>
        <div class="suggestions hidden" id="suggestions"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="hint-row">
        <button class="btn btn-outline btn-block" type="button" onclick="useHint()" ${rs.lives<=1 || rs.foundCount===q.answers.length ? 'disabled':''}>💡 Hint (−1 ❤️)</button>
      </div>
    </div>
    <button class="btn btn-outline btn-block" onclick="quitRound()">🏳️ Give up &amp; reveal answers</button>
  `;
}

function getSuggestionMatches(query){
  const q = (query||"").trim().toLowerCase();
  if(q.length < 1) return [];
  return SUGGESTION_POOL.filter(name => name.toLowerCase().startsWith(q)).slice(0,6);
}
function handleTypeahead(value){
  const box = document.getElementById("suggestions");
  if(!box) return;
  const matches = getSuggestionMatches(value);
  if(matches.length === 0){
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }
  box.innerHTML = matches.map(m => `<div class="sug-item" onmousedown="selectSuggestion('${m.replace(/'/g,"\\'")}')">${m}</div>`).join("");
  box.classList.remove("hidden");
}
function selectSuggestion(name){
  const input = document.getElementById("guessInput");
  if(!input) return;
  input.value = name;
  hideSuggestions();
  submitGuess(new Event("submit"), true);
}
function hideSuggestions(){
  const box = document.getElementById("suggestions");
  if(box){ box.classList.add("hidden"); box.innerHTML = ""; }
}
function hideSuggestionsSoon(){
  setTimeout(hideSuggestions, 150);
}

function useHint(){
  const rs = roundState;
  if(!rs || rs.over) return;
  if(rs.lives <= 1){ showToast("Not enough lives left for a hint"); return; }
  const remaining = rs.question.answers.map((a,i)=>({a,i})).filter(x=>!rs.found[x.i]);
  if(remaining.length === 0) return;
  const pick = remaining[Math.floor(Math.random()*remaining.length)];
  rs.lives--;
  AudioFX.hint();
  showToast(`💡 Hint: one answer starts with "${pick.a[0].toUpperCase()}"`);
  if(rs.lives <= 0){ finishRound(false); return; }
  renderRound();
}

function submitGuess(e, fromSuggestion){
  if(e && e.preventDefault) e.preventDefault();
  const rs = roundState;
  if(!rs || rs.over) return;
  const input = document.getElementById("guessInput");
  const raw = (input ? input.value : "").trim();
  if(!raw) return;
  const norm = normalize(raw);
  if(input) input.value = "";
  hideSuggestions();

  const q = rs.question;
  let matchedIndex = -1;
  for(let i=0;i<q.answers.length;i++){
    if(rs.found[i]) continue; // already found
    const set = buildAliasSet(q.answers[i]);
    if(set.has(norm)){ matchedIndex = i; break; }
  }

  const feedback = document.getElementById("feedback");

  if(matchedIndex !== -1){
    rs.found[matchedIndex] = q.answers[matchedIndex];
    rs.foundCount++;
    const POINTS_BY_DIFFICULTY = { easy: 7, medium: 10, hard: 15, expert: 22 };
    addScore(POINTS_BY_DIFFICULTY[q.difficulty] || 7);
    AudioFX.correct();
    feedback.textContent = "✅ Correct! " + q.answers[matchedIndex] + " is on the list.";
    feedback.className = "feedback ok";
    saveState();
    if(rs.foundCount === q.answers.length){
      finishRound(true);
      return;
    }
  } else {
    if(rs.wrongGuesses.has(norm)){
      AudioFX.click();
      feedback.textContent = "🤔 You already tried that one.";
      feedback.className = "feedback bad";
    } else {
      rs.wrongGuesses.add(norm);
      rs.lives--;
      AudioFX.wrong();
      feedback.textContent = "❌ Not on the list. Life lost.";
      feedback.className = "feedback bad";
      if(rs.lives <= 0){
        finishRound(false);
        return;
      }
    }
  }
  renderRound();
  document.getElementById("feedback").textContent = feedback.textContent;
  document.getElementById("feedback").className = feedback.className;
}

function quitRound(){
  finishRound(false);
}

function finishRound(completedAll){
  const rs = roundState;
  rs.over = true;
  const q = rs.question;

  if(rs.duel){
    finishDuelLeg(completedAll);
    return;
  }

  const wouldLoseStreak = !completedAll && rs.foundCount < q.answers.length && rs.lives <= 0
    && state.streak > 0 && !state.premium;
  if(wouldLoseStreak){
    renderStreakSaveOffer();
    return; // paused — resumes via saveStreakWithTrial() or declineStreakSave()
  }
  finalizeRound(completedAll, false);
}

function renderStreakSaveOffer(){
  const rs = roundState;
  const q = rs.question;
  const canTrial = !state.trialUsed;
  main.innerHTML = `
    <div class="card center" style="border-color:var(--red);">
      <h2>💔 About to lose your ${state.streak}-round streak</h2>

      <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="declineStreakSave()">No thanks, reset my streak</button>
    </div>
  `;
}
async function saveStreakWithTrial(){
  if(backendEnabled){
    if(!authSession){
      showToast("👤 Sign in on the Premium screen to save streaks with a free trial");
      finalizeRound(false, false);
      return;
    }

  }

}
function declineStreakSave(){

  finalizeRound(false, false);
}

function finalizeRound(completedAll, shieldAlreadyUsed){
  const rs = roundState;
  const q = rs.question;
  let shieldUsed = shieldAlreadyUsed;

  if(completedAll){
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    addScore(25); // completion bonus
    if(STREAK_MILESTONES[state.streak]){
      const bonus = addScore(STREAK_MILESTONES[state.streak]);
      showToast(`🔥 ${state.streak}-round streak! +${bonus} bonus points`);
    }
  } else if(!shieldUsed && rs.foundCount < q.answers.length && rs.lives <= 0){
    if(state.streak > 0 && streakShieldAvailable()){
      state.shieldDate = todayStr();
      shieldUsed = true;
      showToast("🛡️ Streak Shield protected your streak!");
    } else {
      state.streak = 0;
    }
  }
  if(!state.playedIds.includes(q.id)) state.playedIds.push(q.id);

  state.history.unshift({
    questionId: q.id, title: q.title, icon: q.icon, difficulty: q.difficulty,
    foundCount: rs.foundCount, total: q.answers.length, completedAll, date: todayStr()
  });
  if(state.history.length > 200) state.history.length = 200;

  if(rs.isDaily){
    state.dailyDate = todayStr();
    state.dailyQuestionId = q.id;
    state.dailyCompleted = true;
  }
  saveState();
  syncRoundToServer(q, rs, completedAll, shieldUsed);
  completedAll ? AudioFX.win() : AudioFX.lose();

  const revealHtml = q.answers.map((a,i)=>{
    const got = !!rs.found[i];
    return `<div class="slot ${got?'filled':''}">
      <span class="rank">${q.ranked ? (i+1) : '•'}</span><span>${got ? "✅ " : "⬜ "}${a}</span>
    </div>`;
  }).join("");

  const newBadges = getEarnedBadges().filter(b => !(state.seenBadges||[]).includes(b.id));
  if(newBadges.length){
    state.seenBadges = [...(state.seenBadges||[]), ...newBadges.map(b=>b.id)];
    saveState();
  }

  main.innerHTML = `
    <div class="card center">
      <h2>${completedAll ? "🎉 Nailed it!" : "😅 Round over"}</h2>
      <p class="sub">You found ${rs.foundCount} of ${q.answers.length}${completedAll ? "" : " before running out of lives"}.${shieldUsed ? " 🛡️ Your streak was protected." : ""}</p>
      <div class="slots" style="text-align:left;">${revealHtml}</div>
      <div class="fact-box"><b>💡 Did you know?</b> ${q.fact}</div>
      ${newBadges.length ? `<div class="fact-box" style="border-color:var(--gold);background:rgba(251,191,36,.08);"><b>🏅 New badge${newBadges.length>1?'s':''}!</b> ${newBadges.map(b=>b.icon+' '+b.label).join(', ')}</div>` : ''}
      <div class="row" style="margin-top:16px;">
        <button class="btn btn-outline btn-block" onclick="goHome()">🏠 Home</button>
        <button class="btn btn-primary btn-block" onclick="renderLevels()">▶ Play another</button>
      </div>
      <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="shareResult()">📤 Share result</button>
    </div>
  `;
}

async function syncRoundToServer(q, rs, completedAll, shieldUsed){
  if(!backendEnabled || !authSession) return;
  try{
    const { profile, milestoneBonus } = await apiFetch("/api/finish-round", {
      method: "POST",
      body: JSON.stringify({
        questionId: q.id,
        foundCount: rs.foundCount,
        completedAll,
        isDaily: !!rs.isDaily,
        useShield: shieldUsed
      })
    });
    applyServerProfile(profile);
    if(milestoneBonus) showToast(`🔥 Synced — +${milestoneBonus} streak bonus points`);
  } catch(e){
    // Offline, backend not deployed yet, or a server-side gate (e.g. practice cap) —
    // local score for this round already stands, so just surface real rejections.
    if(e.status === 403) showToast("⚠️ " + e.message);
  }
}

function shareResult(){
  const rs = roundState;
  if(!rs) return;
  const q = rs.question;
  const grid = q.answers.map((a,i)=> rs.found[i] ? "🟩" : "⬜").join("");
  const text = `Top 10 Geo ${q.icon || "🌍"} ${q.title}\n${grid} ${rs.foundCount}/${q.answers.length}\n🔥 Streak: ${state.streak}`;
  AudioFX.click();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>showToast("📋 Result copied to clipboard!"))
      .catch(()=>showToast("Copy failed — screenshot instead?"));
  } else {
    showToast("📋 " + text.replace(/\n/g," · "));
  }
}

/* =========================================================
   DUEL MODE (same-device pass-and-play, Premium-exclusive)
   True cross-device multiplayer would need a backend to sync
   two separate players in real time — out of scope for a
   client-only prototype. This delivers the "who can name the
   most" competitive feel without needing one, by running the
   same round twice on one device and comparing results.
   ========================================================= */
function renderDuelPicker(){
  if(!state.premium){ renderPremium(); return; }
  const rec = state.duelRecord;
  const levels = ["easy","medium","hard","expert"];
  let html = `<div class="card">
    <h2>⚔️ Duel Mode</h2>
    <p class="sub">Pick a category. Player 1 goes first, then pass the device to Player 2 for the identical question — most correct wins, fastest time breaks ties.</p>
    <div class="row" style="margin-top:10px;">
      <div class="duel-card" style="flex:1;"><div style="font-size:12px;color:var(--text-dim);">Player 1 wins</div><div class="duel-score" style="font-size:20px;">${rec.p1Wins}</div></div>
      <div class="duel-card" style="flex:1;"><div style="font-size:12px;color:var(--text-dim);">Ties</div><div class="duel-score" style="font-size:20px;">${rec.ties}</div></div>
      <div class="duel-card" style="flex:1;"><div style="font-size:12px;color:var(--text-dim);">Player 2 wins</div><div class="duel-score" style="font-size:20px;">${rec.p2Wins}</div></div>
    </div>
    <p class="sub" style="margin-top:8px;font-size:11px;">🏅 Head-to-head record for this device's two seats — not tied to named accounts, since there's no login system here.</p>
  </div>`;
  levels.forEach(lvl=>{
    const qs = QUESTIONS.filter(q=>q.difficulty===lvl);
    if(qs.length === 0) return;
    html += `<div class="card"><span class="badge ${lvl}">${LEVEL_ICON[lvl]} ${lvl}</span><div class="cat-list" style="margin-top:12px;">`;
    qs.forEach(q=>{
      html += `<div class="cat-item" onclick="startDuel(${q.id})">
        <div class="name">${q.icon || "🌍"} ${q.title}${(q.topic||'geography')==='general' ? ' <span class="badge locked" style="font-size:10px;">🎉</span>' : ''}</div>
        <div style="color:var(--text-dim);font-size:12px;">⚔️</div>
      </div>`;
    });
    html += `</div></div>`;
  });
  html += `<button class="btn btn-outline btn-block" onclick="goHome()">← Back home</button>`;
  main.innerHTML = html;
}

function startDuel(questionId){
  if(!state.premium){ renderPremium(); return; }
  duelState = { p1: null, p2: null };
  AudioFX.click();
  startRound(questionId, false, {player: 1});
}

function finishDuelLeg(completedAll){
  const rs = roundState;
  const q = rs.question;
  const elapsed = Date.now() - rs.startedAt;
  const result = { foundCount: rs.foundCount, lives: rs.lives, elapsed, completedAll };
  completedAll ? AudioFX.win() : AudioFX.lose();

  if(rs.duel.player === 1){
    duelState.p1 = result;
    main.innerHTML = `
      <div class="card center">
        <h2>🔄 Pass the device</h2>
        <p class="sub">Player 1 found <b style="color:var(--text)">${result.foundCount}/${q.answers.length}</b> on <b>${q.icon || "🌍"} ${q.title}</b>. Hand the device to Player 2 for the exact same question.</p>
        <button class="btn btn-primary btn-block" onclick="startRound(${q.id}, false, {player:2})">▶ Player 2: Start</button>
      </div>
    `;
  } else {
    duelState.p2 = result;
    renderDuelResults(q);
  }
}

function renderDuelResults(q){
  const p1 = duelState.p1, p2 = duelState.p2;
  let winner = null;
  if(p1.foundCount !== p2.foundCount){
    winner = p1.foundCount > p2.foundCount ? 1 : 2;
  } else if(p1.elapsed !== p2.elapsed){
    winner = p1.elapsed < p2.elapsed ? 1 : 2; // tiebreak: same score, faster wins
  }
  if(winner === 1) state.duelRecord.p1Wins++;
  else if(winner === 2) state.duelRecord.p2Wins++;
  else state.duelRecord.ties++;
  saveState();
  const fmtTime = ms => (ms/1000).toFixed(1) + "s";

  main.innerHTML = `
    <div class="card center">
      <h2>⚔️ Duel Results</h2>
      <p class="sub">${q.icon || "🌍"} ${q.title}</p>
      <div class="row" style="margin:16px 0;">
        <div class="duel-card ${winner===1?'winner':''}">
          <div>${winner===1?'🏆 ':''}Player 1</div>
          <div class="duel-score">${p1.foundCount}/10</div>
          <div style="color:var(--text-dim);font-size:12px;">⏱️ ${fmtTime(p1.elapsed)} · ❤️×${p1.lives}</div>
        </div>
        <div class="duel-card ${winner===2?'winner':''}">
          <div>${winner===2?'🏆 ':''}Player 2</div>
          <div class="duel-score">${p2.foundCount}/10</div>
          <div style="color:var(--text-dim);font-size:12px;">⏱️ ${fmtTime(p2.elapsed)} · ❤️×${p2.lives}</div>
        </div>
      </div>
      ${winner ? '' : '<p class="sub">🤝 Perfect tie — even on speed!</p>'}
      <div class="fact-box"><b>💡 Did you know?</b> ${q.fact}</div>
      <div class="row" style="margin-top:16px;">
        <button class="btn btn-outline btn-block" onclick="goHome()">🏠 Home</button>
        <button class="btn btn-primary btn-block" onclick="renderDuelPicker()">⚔️ Rematch</button>
      </div>
    </div>
  `;
  duelState = null;
}

/* =========================================================
   PERSONAL BESTS ("top players" stand-in — see README: a real
   cross-device leaderboard needs a backend + accounts, which
   this client-only prototype doesn't have. This is the honest
   local equivalent: your own best rounds, on this device.)
   ========================================================= */
function renderTopRounds(){
  const info = getLevelInfo(state.score);
  const best = [...state.history]
    .sort((a,b) => (b.foundCount - a.foundCount) || (b.total - a.total))
    .slice(0, 10);
  let html = `<div class="card">
    <h2>🏅 Your Top Rounds</h2>
    <p class="sub">Your best local results, most correct first. This is personal history stored on this device — this prototype has no accounts or server, so it can't compare you to other players. A real leaderboard would need a backend.</p>
    <div class="row" style="justify-content:space-between;">
      <div class="pill">★ ${state.score} total XP</div>
      <div class="pill">🧭 Lv.${info.level} ${info.title}</div>
      <div class="pill">🏆 Best streak ${state.bestStreak}</div>
    </div>
  </div>`;

  const earned = getEarnedBadges().map(b=>b.id);
  html += `<div class="card">
    <h2>🎖️ Badges</h2>
    <p class="sub">Earned by completing every round in a set at least once — some require Premium content to unlock.</p>
    <div class="cat-list">
      ${getAllBadgeDefs().map(b=>{
        const got = earned.includes(b.id);
        return `<div class="cat-item" style="cursor:default;${got?'':'opacity:.4;'}">
          <div class="name">${b.icon} ${b.label}</div>
          <div style="font-size:12px;">${got ? '✅' : '🔒'}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;

  if(best.length === 0){
    html += `<div class="card center"><p class="sub">No rounds played yet — go play one!</p></div>`;
  } else {
    html += `<div class="card"><div class="cat-list">`;
    best.forEach((r,i)=>{
      html += `<div class="cat-item" style="cursor:default;">
        <div class="name">#${i+1} ${r.icon||"🌍"} ${r.title} ${r.completedAll ? '🎉' : ''}</div>
        <div style="color:var(--text-dim);font-size:12px;">${r.foundCount}/${r.total}</div>
      </div>`;
    });
    html += `</div></div>`;
  }
  html += `<button class="btn btn-outline btn-block" onclick="goHome()">← Back home</button>`;
  main.innerHTML = html;
}

/* =========================================================
   INIT
   ========================================================= */
renderPills();
renderMuteBtn();
renderHome();
initAuth().then(() => {
  const params = new URLSearchParams(window.location.search);
  if(params.get("checkout") === "success"){
    showToast("✅ Payment received — syncing your account...");
    syncProfileFromServer().then(() => { if(document.getElementById("main")) renderPremium(); });
    window.history.replaceState({}, "", window.location.pathname);
  } else if(params.get("checkout") === "cancelled"){
    window.history.replaceState({}, "", window.location.pathname);
  }
});
</script>
