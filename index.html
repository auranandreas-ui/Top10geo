<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top 10 Geo — Daily Geography Trivia</title>
<meta name="description" content="Name the top 10 in a new geography trivia round every day, free. 82 rounds spanning countries, mountains, rivers and more, plus a Premium tier with every difficulty, Duel Mode, and bonus game modes.">
<meta property="og:title" content="Top 10 Geo — Daily Geography Trivia">
<meta property="og:description" content="Name the top 10 in a new geography trivia round every day, free. 82 rounds spanning countries, mountains, rivers and more.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://top10geo.com">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Top 10 Geo — Daily Geography Trivia">
<meta name="twitter:description" content="Name the top 10 in a new geography trivia round every day, free.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0f172a;
    --bg-soft:#111c34;
    --card:#16213e;
    --card-2:#1b2a4a;
    --accent:#38bdf8;
    --accent-2:#22d3ee;
    --gold:#fbbf24;
    --green:#34d399;
    --red:#f87171;
    --text:#e2e8f0;
    --text-dim:#94a3b8;
    --border:#26375c;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at top, #17264a 0%, var(--bg) 60%);
    color:var(--text);
    min-height:100vh;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:84px;
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    position:sticky;
    top:0;
    background:rgba(15,23,42,0.9);
    backdrop-filter:blur(6px);
    z-index:10;
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:800;
    font-size:19px;
    letter-spacing:-.01em;
    cursor:pointer;
    background:linear-gradient(135deg,#f1f5f9,var(--accent-2) 140%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand .globe{font-size:24px;filter:drop-shadow(0 0 8px rgba(56,189,248,.45));}
  .stat-pills{display:flex;gap:8px;align-items:center;}
  .pill{
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:999px;
    padding:5px 10px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:4px;
    white-space:nowrap;
  }
  .pill.gold{color:var(--gold);}
  .pill.ok{color:var(--green);border-color:rgba(52,211,153,.4);cursor:pointer;}
  .pill.warn{color:var(--gold);border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.08);cursor:pointer;}
  main{padding:18px 20px;flex:1;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:16px;
  }
  .card h2{margin:0 0 6px;font-size:18px;}
  .card p.sub{color:var(--text-dim);font-size:14px;margin:0 0 14px;line-height:1.5;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:12px;
    padding:12px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#04202e;}
  .btn-gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3a2400;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:10px;}
  .badge{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-weight:700;
    padding:3px 8px;
    border-radius:999px;
    display:inline-block;
  }
  .badge.easy{background:rgba(52,211,153,.15);color:var(--green);}
  .badge.medium{background:rgba(251,191,36,.15);color:var(--gold);}
  .badge.hard{background:rgba(248,113,113,.15);color:var(--red);}
  .badge.expert{background:rgba(167,139,250,.15);color:#a78bfa;}
  .badge.locked{background:rgba(148,163,184,.15);color:var(--text-dim);}
  .duel-card{
    flex:1;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    text-align:center;
    background:var(--card-2);
  }
  .duel-card.winner{border-color:var(--gold);background:rgba(251,191,36,.08);}
  .duel-score{font-size:28px;font-weight:800;margin:4px 0;}
  .nav-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .nav-tabs button{
    flex:1;
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:10px;
    border-radius:12px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .nav-tabs button.active{background:var(--accent);color:#04202e;border-color:var(--accent);}
  .bottom-nav{
    position:fixed;
    left:0;right:0;bottom:0;
    max-width:520px;
    margin:0 auto;
    display:flex;
    background:rgba(15,23,42,0.96);
    backdrop-filter:blur(6px);
    border-top:1px solid var(--border);
    z-index:40;
  }
  .bottom-nav button{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-size:11px;
    font-weight:600;
    padding:9px 4px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
  }
  .bottom-nav button .icon{font-size:19px;}
  .bottom-nav button.active{color:var(--accent);}
  .round-visual{display:flex;justify-content:center;margin:6px 0 2px;color:var(--accent);opacity:.85;}
  .cat-list{display:flex;flex-direction:column;gap:10px;}
  .cat-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    cursor:pointer;
  }
  .cat-item.locked{opacity:.55;cursor:default;}
  .cat-item .name{font-size:14px;font-weight:600;}
  .lives{display:flex;gap:4px;font-size:18px;}
  .life.lost{opacity:.25;filter:grayscale(1);}
  .slots{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:16px 0;
  }
  .slot{
    background:var(--card-2);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    min-height:20px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .slot.filled{
    border-style:solid;
    border-color:var(--green);
    background:rgba(52,211,153,.08);
    font-weight:600;
  }
  .slot .rank{
    color:var(--text-dim);
    font-weight:700;
    min-width:18px;
  }
  .slot.filled .rank{color:var(--green);}
  .guess-row{display:flex;gap:8px;margin-top:10px;}
  input[type=text]{
    flex:1;
    background:var(--card-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:12px;
    padding:12px 14px;
    font-size:15px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--accent);}
  .feedback{
    margin-top:10px;
    font-size:14px;
    min-height:20px;
    font-weight:600;
  }
  .feedback.ok{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .progress-bar{
    height:6px;
    background:var(--card-2);
    border-radius:999px;
    overflow:hidden;
    margin-top:10px;
  }
  .progress-bar > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));}
  .fact-box{
    background:rgba(56,189,248,.08);
    border:1px solid rgba(56,189,248,.25);
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    color:var(--text-dim);
    margin-top:14px;
  }
  .fact-box b{color:var(--accent);}
  .lock-overlay{
    text-align:center;
    padding:30px 10px;
  }
  .lock-overlay .icon{font-size:34px;margin-bottom:6px;}
  .plans{display:flex;flex-direction:column;gap:12px;margin:16px 0;}
  .plan{
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    background:var(--card-2);
  }
  .plan.featured{border-color:var(--gold);background:rgba(251,191,36,.06);}
  .plan .price{font-size:22px;font-weight:800;margin:2px 0 8px;}
  .plan .price span{font-size:13px;color:var(--text-dim);font-weight:500;}
  .plan ul{margin:0;padding-left:18px;font-size:13px;color:var(--text-dim);line-height:1.7;}
  footer.note{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    padding:14px 20px 0;
  }
  .center{text-align:center;}
  .hidden{display:none !important;}
  .streak-line{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-dim);margin-bottom:12px;}
  .divider{height:1px;background:var(--border);margin:16px 0;}
  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:var(--card-2);
    border:1px solid var(--accent);
    color:var(--text);
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
  .pill.mute-btn{cursor:pointer;user-select:none;}
  .guess-wrap{position:relative;}
  .suggestions{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:var(--card-2);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    z-index:20;
    box-shadow:0 10px 24px rgba(0,0,0,.35);
  }
  .suggestions .sug-item{
    padding:10px 14px;
    font-size:14px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .suggestions .sug-item:last-child{border-bottom:none;}
  .suggestions .sug-item:hover, .suggestions .sug-item.active{background:rgba(56,189,248,.12);}
  .hint-row{display:flex;gap:8px;margin-top:10px;}
  .cg-dots{display:flex;gap:7px;justify-content:center;margin:14px 0;}
  .cg-dot{width:13px;height:13px;border-radius:50%;background:var(--card-2);border:1.5px solid var(--border);}
  .cg-dot.used{background:var(--accent);border-color:var(--accent);}
  .cg-guess{background:var(--card-2);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .cg-guess.correct{border-color:var(--green);background:rgba(52,211,153,.10);}
  .cg-guess .cg-name{font-weight:800;font-size:17px;margin-bottom:9px;}
  .cg-chips{display:flex;flex-wrap:wrap;gap:8px;}
  .cg-chip{background:rgba(56,189,248,.10);border:1.5px solid var(--accent);color:var(--text);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:700;white-space:nowrap;}
  .cg-chip.good{background:rgba(52,211,153,.14);color:var(--green);border-color:var(--green);}
  .cg-chip.bad{background:rgba(248,113,113,.14);color:var(--red);border-color:var(--red);}
  .gb-prompt{font-size:20px;font-weight:800;text-align:center;margin:14px 0 4px;}
  .gb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .gb-cell{
    background:var(--card-2);border:1.5px solid var(--border);border-radius:10px;
    padding:8px 6px;font-size:11px;font-weight:700;text-align:center;color:var(--text);
    cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:center;
    line-height:1.25;font-family:inherit;
  }
  .gb-cell:disabled{cursor:default;}
  .gb-cell.marked{border-color:var(--green);background:rgba(52,211,153,.14);color:var(--green);}
  .ms-canvas-wrap{
    position:relative;width:100%;aspect-ratio:1/1;max-width:420px;margin:10px auto 0;
    background:var(--card-2);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;
    touch-action:none;
  }
  .ms-canvas-wrap canvas{width:100%;height:100%;display:block;cursor:crosshair;}
  .ms-toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;justify-content:center;}
  .ms-tbtn{
    background:var(--card-2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);
    font-family:inherit;font-size:12px;font-weight:700;padding:8px 10px;cursor:pointer;white-space:nowrap;
  }
  .ms-tbtn:disabled{opacity:.4;cursor:not-allowed;}
  .ms-tbtn.on{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.12);}
  .ms-hint-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;justify-content:center;}
  .ms-score-ring{font-size:40px;font-weight:800;line-height:1;}
  .ad-free-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    color:var(--green);
    background:rgba(52,211,153,.1);
    border:1px solid rgba(52,211,153,.3);
    padding:4px 10px;
    border-radius:999px;
    margin-top:8px;
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand" onclick="goHome()"><span class="globe">🌍</span> Top 10 Geo</div>
    <div class="stat-pills" id="headerStatus"></div>
  </header>

  <main id="main"></main>

  <footer class="note">Prototype build · answer data is illustrative and simplified for gameplay, not a cited reference source.<br>Questions or feedback? <a href="mailto:auranandreas@gmail.com" style="color:var(--accent);">auranandreas@gmail.com</a></footer>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   QUESTION BANK
   26 "Top 10" geography rounds. Order of items reflects a
   real-world ranking where one exists (ranked:true); for
   "name any 10 of these" style rounds (ranked:false) order
   doesn't matter for scoring.
   ========================================================= */
const QUESTIONS = [
  {
    id: 1, difficulty: "easy", ranked: true, icon: "🗺️",
    title: "Largest countries in the world",
    prompt: "Name the top 10 largest countries in the world by land area.",
    fact: "Russia alone spans 11 time zones — nearly twice the next largest country, Canada.",
    answers: ["Russia","Canada","United States","China","Brazil","Australia","India","Argentina","Kazakhstan","Algeria"]
  },
  {
    id: 2, difficulty: "medium", ranked: true, icon: "🔎",
    title: "Smallest countries in the world",
    prompt: "Name the top 10 smallest sovereign countries in the world by land area.",
    fact: "Vatican City is smaller than most golf courses — just 0.49 km².",
    answers: ["Vatican City","Monaco","Nauru","Tuvalu","San Marino","Liechtenstein","Marshall Islands","Saint Kitts and Nevis","Maldives","Malta"]
  },
  {
    id: 3, difficulty: "easy", ranked: true, icon: "👥",
    title: "Most populous countries",
    prompt: "Name the top 10 most populous countries in the world.",
    fact: "India overtook China as the world's most populous country in 2023.",
    answers: ["India","China","United States","Indonesia","Pakistan","Nigeria","Brazil","Bangladesh","Russia","Ethiopia"]
  },
  {
    id: 4, difficulty: "medium", ranked: true, icon: "🧍",
    title: "Least populous countries",
    prompt: "Name the top 10 least populous sovereign countries in the world.",
    fact: "Vatican City has fewer permanent residents than a typical school.",
    answers: ["Vatican City","Tuvalu","Nauru","Palau","San Marino","Liechtenstein","Monaco","Marshall Islands","Saint Kitts and Nevis","Dominica"]
  },
  {
    id: 5, difficulty: "medium", ranked: true, icon: "🌾",
    title: "Lowest population density",
    prompt: "Name the top 10 countries with the lowest population density.",
    fact: "Mongolia averages roughly 2 people per km² — most of the country is steppe and desert.",
    answers: ["Mongolia","Namibia","Australia","Iceland","Suriname","Guyana","Libya","Botswana","Canada","Mauritania"]
  },
  {
    id: 6, difficulty: "hard", ranked: true, icon: "🧭",
    title: "Most land borders",
    prompt: "Name the top 10 countries with the most land borders (neighboring countries).",
    fact: "Russia and China are tied for the most neighbors, each bordering 14 other countries.",
    answers: ["Russia","China","Brazil","Democratic Republic of the Congo","Germany","Austria","France","Tanzania","Turkey","Zambia"]
  },
  {
    id: 7, difficulty: "medium", ranked: true, icon: "🏖️",
    title: "Longest coastlines",
    prompt: "Name the top 10 countries with the longest coastlines.",
    fact: "Canada's coastline stretches over 200,000 km — more than 5 times around the Earth's equator.",
    answers: ["Canada","Indonesia","Russia","Philippines","Japan","Australia","Norway","United States","New Zealand","China"]
  },
  {
    id: 8, difficulty: "hard", ranked: true, icon: "🏞️",
    title: "Largest landlocked countries",
    prompt: "Name the top 10 largest landlocked countries (no ocean coastline) by area.",
    fact: "Kazakhstan is the largest country in the world with no coastline at all.",
    answers: ["Kazakhstan","Mongolia","Chad","Niger","Mali","Ethiopia","Bolivia","Zambia","Afghanistan","Central African Republic"]
  },
  {
    id: 9, difficulty: "medium", ranked: true, icon: "🌋",
    title: "Most volcanoes",
    prompt: "Name the top 10 countries with the most volcanoes.",
    fact: "Indonesia sits on the Pacific 'Ring of Fire' and is home to well over 100 volcanoes.",
    answers: ["Indonesia","United States","Japan","Russia","Chile","Ethiopia","Philippines","Papua New Guinea","Mexico","Guatemala"]
  },
  {
    id: 10, difficulty: "hard", ranked: true, icon: "🗣️",
    title: "Most languages spoken",
    prompt: "Name the top 10 countries with the greatest number of languages spoken.",
    fact: "Papua New Guinea is home to over 800 living languages — more than any other country on Earth.",
    answers: ["Papua New Guinea","Indonesia","Nigeria","India","United States","China","Mexico","Cameroon","Australia","Democratic Republic of the Congo"]
  },
  {
    id: 11, difficulty: "medium", ranked: true, icon: "🏛️",
    title: "Most UNESCO World Heritage Sites",
    prompt: "Name the top 10 countries with the most UNESCO World Heritage Sites.",
    fact: "Italy and China have spent years trading the #1 and #2 spots for most World Heritage Sites.",
    answers: ["Italy","China","Germany","France","Spain","India","Mexico","United Kingdom","Iran","Japan"]
  },
  {
    id: 12, difficulty: "easy", ranked: true, icon: "🏙️",
    title: "Most skyscrapers",
    prompt: "Name the top 10 countries with the most skyscrapers (150m and taller).",
    fact: "China has roughly four times as many 150m+ skyscrapers as the United States, which ranks second.",
    answers: ["China","United States","United Arab Emirates","Malaysia","Japan","South Korea","Canada","Australia","Indonesia","Thailand"]
  },
  {
    id: 13, difficulty: "hard", ranked: true, icon: "⛰️",
    title: "Highest-elevation capital cities",
    prompt: "Name the 10 countries whose capital cities sit at the highest elevation.",
    fact: "La Paz, Bolivia sits roughly 3,640 m above sea level — high enough that visitors often need time to adjust.",
    answers: ["Bolivia","Ecuador","Colombia","Eritrea","Bhutan","Yemen","Ethiopia","Kenya","Rwanda","Afghanistan"]
  },
  {
    id: 14, difficulty: "medium", ranked: false, icon: "🌐",
    title: "Countries on the Equator",
    prompt: "Name 10 countries that the Equator physically passes through.",
    fact: "The Equator passes through 13 countries across three continents (and one ocean-only stretch).",
    answers: ["São Tomé and Príncipe","Gabon","Republic of the Congo","Democratic Republic of the Congo","Uganda","Kenya","Indonesia","Ecuador","Colombia","Brazil"]
  },
  {
    id: 15, difficulty: "easy", ranked: true, icon: "🏔️",
    title: "Tallest mountains in the world",
    prompt: "Name the top 10 tallest mountains in the world.",
    fact: "All 14 of the world's peaks above 8,000m sit in just two ranges: the Himalayas and the Karakoram.",
    answers: ["Mount Everest","K2","Kangchenjunga","Lhotse","Makalu","Cho Oyu","Dhaulagiri","Manaslu","Nanga Parbat","Annapurna"]
  },
  {
    id: 16, difficulty: "easy", ranked: true, icon: "🌊",
    title: "Longest rivers in the world",
    prompt: "Name the top 10 longest rivers in the world.",
    fact: "The Nile and the Amazon are still debated for the title of the world's longest river.",
    answers: ["Nile","Amazon","Yangtze","Mississippi-Missouri","Yenisei","Yellow River","Ob-Irtysh","Río de la Plata-Paraná","Congo","Amur"]
  },
  {
    id: 17, difficulty: "medium", ranked: true, icon: "🏜️",
    title: "Largest deserts in the world",
    prompt: "Name the top 10 largest deserts in the world.",
    fact: "Technically, Antarctica is the largest desert on Earth — deserts are defined by low precipitation, not heat.",
    answers: ["Antarctic Desert","Arctic Desert","Sahara Desert","Arabian Desert","Gobi Desert","Kalahari Desert","Patagonian Desert","Great Victoria Desert","Syrian Desert","Great Basin Desert"]
  },
  {
    id: 18, difficulty: "medium", ranked: true, icon: "💧",
    title: "Largest lakes in the world",
    prompt: "Name the top 10 largest lakes in the world by surface area.",
    fact: "The Caspian Sea is so big it's classified as the world's largest lake — bigger than the whole of Germany.",
    answers: ["Caspian Sea","Lake Superior","Lake Victoria","Lake Huron","Lake Michigan","Lake Tanganyika","Lake Baikal","Great Bear Lake","Lake Malawi","Great Slave Lake"]
  },
  {
    id: 19, difficulty: "easy", ranked: true, icon: "🏝️",
    title: "Largest islands in the world",

/* Classifies a question by the *kind* of answer it wants, from its title.
   Keyword-based rather than a hand-tagged field on all 82 questions, so new
   rounds get sensible suggestions automatically. Falls back to "country",
   which the large majority of rounds are. */
function answerTypeFor(q){
  const t = (q.title || "").toLowerCase();
  if(/mountain|range/.test(t)) return "mountain";
  if(/\briver/.test(t)) return "river";  // \b avoids matching "river" inside "Drivers'"
  if(/lake/.test(t)) return "lake";
  if(/desert|salt flat/.test(t) || (/island/.test(t) && !/nation/.test(t))) return "geoplace";
  if(/capital|urban area|airport/.test(t)) return "city";
  if(/animal|sea creature/.test(t)) return "animal";
  if(/artist|grammy|monarch|grand slam/.test(t)) return "person";
  if(/compan(y|ies)|fast food|nba championship|website|currenc/.test(t)) return "org";
  if(/movie|video game|building|element|empire/.test(t)) return "misc";
  return "country";
}
/* One suggestion pool per answer type, built from every OTHER question's
   answers of that same type (the country pool covers its own type directly).
   Because a pool is pulled from many different rounds, it never equals the
   exact 10-answer set of any single round in play. */
const SUGGESTION_POOLS_BY_TYPE = (() => {
  const pools = { country: COUNTRY_POOL.slice() };
  QUESTIONS.forEach(q=>{
    const type = answerTypeFor(q);
    if(type === "country") return;
    (pools[type] = pools[type] || []).push(...q.answers);
  });
  Object.keys(pools).forEach(k => { pools[k] = Array.from(new Set(pools[k])).sort(); });
  return pools;
})();
function suggestionPoolFor(question){
  const type = question ? answerTypeFor(question) : "country";
  return SUGGESTION_POOLS_BY_TYPE[type] || SUGGESTION_POOLS_BY_TYPE.country;
}

/* Finds the answer-type a player has the lowest find-rate on, from round
   history (which includes daily plays, so even free players build up
   signal here). Needs a couple of rounds of a given type before judging,
   so a single unlucky round doesn't get flagged as a "weakness". */
function getWeakestCategory(){
  const stats = {};
  state.history.forEach(h => {
    const q = QUESTIONS.find(x => x.id === h.questionId);
    if(!q) return;
    const type = answerTypeFor(q);
    const s = stats[type] || (stats[type] = { found: 0, total: 0, rounds: 0 });
    s.found += h.foundCount;
    s.total += h.total;
    s.rounds += 1;
  });
  let weakest = null;
  Object.keys(stats).forEach(type => {
    const s = stats[type];
    if(s.rounds < 2 || s.total === 0) return;
    const acc = s.found / s.total;
    if(!weakest || acc < weakest.acc) weakest = { type, acc, rounds: s.rounds };
  });
  return weakest;
}

   SOUND EFFECTS (synthesized, no audio files needed)
   ========================================================= */
const AudioFX = (function(){
  let ctx = null;
  let muted = localStorage.getItem("top10geo_muted") === "1";
  function getCtx(){
    if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, duration, type, gain, delay){
    if(muted) return;
    try{
      const c = getCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      osc.connect(g); g.connect(c.destination);
      const t0 = c.currentTime + (delay || 0);
      g.gain.setValueAtTime(gain || 0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.start(t0);
      osc.stop(t0 + duration + 0.03);
    }catch(e){ /* audio not available — fail silently */ }
  }
  return {
    correct(){ tone(880,0.12,"sine",0.18,0); tone(1318.5,0.16,"sine",0.14,0.08); },
    wrong(){ tone(180,0.28,"sawtooth",0.14,0); },
    click(){ tone(500,0.05,"square",0.06,0); },
    win(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.18,"sine",0.16,i*0.09)); },
    lose(){ tone(220,0.3,"sawtooth",0.12,0); tone(170,0.35,"sawtooth",0.12,0.15); },
    hint(){ tone(660,0.1,"triangle",0.12,0); },
    toggleMute(){
      muted = !muted;
      localStorage.setItem("top10geo_muted", muted ? "1" : "0");
      return muted;
    },
    isMuted(){ return muted; }
  };
})();
function toggleMute(){
  const nowMuted = AudioFX.toggleMute();
  renderHeaderStatus();
  if(!nowMuted) AudioFX.click();
}

function getLevelInfo(score){
  const level = Math.floor(Math.sqrt(Math.max(0,score) / 40)) + 1;
  const title = LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)];
  const currentFloor = Math.pow(level - 1, 2) * 40;
  const nextFloor = Math.pow(level, 2) * 40;
  const progress = nextFloor > currentFloor ? (score - currentFloor) / (nextFloor - currentFloor) : 1;
  return { level, title, currentFloor, nextFloor, progress: Math.max(0, Math.min(1, progress)) };
}

/* Both date helpers use UTC so the daily question and streak/shield resets
   happen at one consistent moment worldwide (UTC midnight), rather than at
   each player's own local midnight. */
function todayStr(){
  const d = new Date();
  return d.getUTCFullYear()+"-"+(d.getUTCMonth()+1)+"-"+d.getUTCDate();
}
function dayOfYear(){
  const d = new Date();
  const start = Date.UTC(d.getUTCFullYear(), 0, 0);
  const now = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  return Math.floor((now - start) / 86400000);
}

  const idx = dayOfYear() % QUESTIONS.length;

/* =========================================================
   BACKEND (Supabase auth + Stripe payments via /api routes)
   Fill in supabaseUrl / supabaseAnonKey below once you've
   deployed the webapp/ folder (see webapp/DEPLOY.md). Until
   then backendEnabled stays false and the whole game runs
   exactly like the original local-only prototype — nothing
   here changes offline play.
   Once configured: signed-out visitors and anyone without a
   deployed backend still play locally and instantly. Signed-in
   players get their score/streak/premium synced with the real
   database, and Premium purchases go through actual Stripe
   Checkout instead of the local "simulate" buttons.
   ========================================================= */
const BACKEND = {
  supabaseUrl: "",     // e.g. "https://xxxxx.supabase.co"
  supabaseAnonKey: ""  // Supabase project's public "anon" key (safe to expose)
};
const backendEnabled = !!(BACKEND.supabaseUrl && BACKEND.supabaseAnonKey);
let sb = null;
let authSession = null;
if(backendEnabled && window.supabase){
  // Explicit (matches supabase-js defaults, but stated on purpose): keep the
  // session in localStorage and let the client auto-refresh the access
  // token in the background so a long-lived tab doesn't silently fall out
  // of being signed in.
  sb = window.supabase.createClient(BACKEND.supabaseUrl, BACKEND.supabaseAnonKey, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
}

/* Access tokens expire (~1hr). Auto-refresh normally keeps `authSession`
   current, but there's a real race window — e.g. a backgrounded tab, or a
   round finishing right as the token turns over — where apiFetch can still
   send a stale token. Previously a 401 here was swallowed silently: the
   client had already bumped score/streak optimistically in memory, so the
   round LOOKED saved, but the server never actually recorded it — and the
   next successful profile sync would quietly overwrite the local value back
   down, which is what "streak doesn't update" was actually reporting. Now:
   on a 401, try one silent session refresh + retry (covers the common
   race), and if that also fails, surface it clearly instead of hiding it. */
async function apiFetch(path, opts){
  opts = opts || {};
  const doFetch = async () => {
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if(authSession && authSession.access_token){
      headers["Authorization"] = "Bearer " + authSession.access_token;
    }
    return fetch(path, Object.assign({}, opts, { headers }));
  };
  let res = await doFetch();
  if(res.status === 401 && sb && authSession){
    try{
      const { data, error } = await sb.auth.refreshSession();
      if(!error && data && data.session){
        authSession = data.session;
        res = await doFetch();
      }
    }catch(e){ /* refresh failed — fall through to the still-401 response below */ }
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* no body */ }
  if(!res.ok){
    const err = new Error((data && data.error) || ("Request failed (" + res.status + ")"));
    err.status = res.status;
    if(res.status === 401) handleSessionExpired();
    throw err;
  }
  return data;
}

/* Called whenever the server tells us the session is actually invalid (not
   just a transient race the refresh-and-retry above already handled).
   Clears local auth state and makes it visibly obvious + one tap to fix,
   instead of silently reverting to local-only mode with no explanation. */
function handleSessionExpired(){
  if(!authSession) return; // already handled
  authSession = null;
  renderHeaderStatus();
  showToast("⚠️ Signed out — tap the header to sign in again");
}

function applyServerProfile(p){
  if(!p) return;
  state.score = p.score;
  state.streak = p.streak;
  state.bestStreak = p.best_streak;
  state.premium = p.premium;
  state.lifetime = p.lifetime;
  state.shieldDate = p.shield_date;
  state.lastSeenLevel = p.last_seen_level;
  saveState();
}

async function syncProfileFromServer(){
  if(!backendEnabled || !authSession) return;
  try{
    const { profile } = await apiFetch("/api/me");
    applyServerProfile(profile);
  }catch(e){ /* deployed but unreachable, or profile still provisioning — keep local state */ }
}

async function sendMagicLink(email){
  if(!sb || !email) return;
  try{
    await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.href } });
    showToast("📬 Check " + email + " for a sign-in link");
  }catch(e){
    showToast("Couldn't send link: " + e.message);

}
async function signOut(){
  if(!sb) return;
  await sb.auth.signOut();
  authSession = null;
  renderHeaderStatus();

async function initAuth(){
  if(!backendEnabled || !sb) return;
  const { data } = await sb.auth.getSession();
  authSession = data && data.session;
  sb.auth.onAuthStateChange((_event, session) => {
    const justSignedIn = !authSession && session;
    authSession = session;
    renderHeaderStatus();
    syncProfileFromServer().then(() => { if(justSignedIn) renderPremium(); });
  });
  if(authSession) await syncProfileFromServer();
  renderHeaderStatus();
}

   HELPERS
   ========================================================= */
function normalize(s){
  return s.toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/^\s*the\s+/,"")
    .replace(/[^a-z0-9]/g,"");
}
function buildAliasSet(answerName){
  const set = new Set();
  set.add(normalize(answerName));
  const key = answerName.toLowerCase();
  if(ALIASES[key]){
    ALIASES[key].forEach(a => set.add(normalize(a)));
  }
  return set;
}
/* Typo forgiveness: if a guess doesn't exactly match any alias but is a
   near-miss (edit distance) on a still-unfound answer, count it as correct
   instead of costing a life over a misspelling. Thresholds scale with word
   length and stay at 0 for short words, where a 1-letter edit distance can
   flip one real answer into a different real one (e.g. "Chad" vs "China"). */
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  const dp = new Array(n + 1);
  for(let j = 0; j <= n; j++) dp[j] = j;
  for(let i = 1; i <= m; i++){
    let prev = dp[0];
    dp[0] = i;
    for(let j = 1; j <= n; j++){
      const tmp = dp[j];
      dp[j] = a[i - 1] === b[j - 1] ? prev : 1 + Math.min(prev, dp[j], dp[j - 1]);
      prev = tmp;
    }
  }
  return dp[n];
}
function fuzzyMatchThreshold(len){
  if(len <= 4) return 0;
  if(len <= 7) return 1;
  return 2;
}
function findFuzzyMatch(norm, question, foundArr){
  let bestIdx = -1, bestDist = Infinity;
  for(let i = 0; i < question.answers.length; i++){
    if(foundArr[i]) continue;
    const canon = normalize(question.answers[i]);
    const threshold = fuzzyMatchThreshold(canon.length);
    if(threshold === 0) continue;
    const dist = levenshtein(norm, canon);
    if(dist > 0 && dist <= threshold && dist < bestDist){
      bestDist = dist;
      bestIdx = i;
    }
  }
  return bestIdx;
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;

}

    html += `<div class="card"><span class="badge ${lvl}">${LEVEL_ICON[lvl]} ${lvl}</span>${!state.premium ? `<span class="badge locked" style="margin-left:6px;">🔒 Premium</span>` : ''}<div class="cat-list" style="margin-top:12px;">`;
    let prevAttempted = true;
    qs.forEach((q, i)=>{
      const isCleared = completed.has(q.id);
      const wasAttempted = attempted.has(q.id);
      const needsPremium = !state.premium;
      const locked = needsPremium || !prevAttempted;
      const lockLabel = locked ? '🔒' : (isCleared ? '✅' : (wasAttempted ? '↻' : '▶'));
      html += `<div class="cat-item ${locked?'locked':''}" onclick="${locked ? `handleLockedRound(${needsPremium})` : `startRound(${q.id}, false)`}">
        <div class="name">${LEVEL_ICON[lvl]} Round ${i+1}</div>
        <div style="color:var(--text-dim);font-size:12px;">${lockLabel}</div>
      </div>`;
      prevAttempted = wasAttempted;
    });
    html += `</div></div>`;
  });
  html += `<button class="btn btn-outline btn-block" onclick="goHome()">← Back home</button>`;
  main.innerHTML = html;
}

/* =========================================================
   GAME ROUND
   ========================================================= */
let roundState = null;
let duelState = null;
function startRound(questionId, isDaily, duelCtx, opts){
  const q = QUESTIONS.find(x=>x.id===questionId);
  if(!q) return;
  const isChallenge = !!(opts && opts.mode === 'challenge');
  // A challenge round is a one-off invite from a friend — it bypasses the
  // normal Premium/sequential gating entirely (same idea as Duel Mode),
  // since the point is letting anyone accept a specific invited round.
  if(!duelCtx && !isDaily && !isChallenge){
    if(!state.premium){
      showToast("🔒 Competing requires Premium — free players get the daily question");
      renderPremium();
      return;
    }
    const tier = QUESTIONS.filter(x => x.difficulty === q.difficulty && (x.topic||"geography") === (q.topic||"geography")).sort((a,b)=>a.id-b.id);
    const idx = tier.findIndex(x=>x.id===q.id);
    if(idx > 0 && !(state.playedIds||[]).includes(tier[idx-1].id)){
      showToast("🔒 Play the previous round in this tier first");
      renderLevels((q.topic||"geography") === "general" ? "general" : "geography");
      return;
    }
  }
  roundState = {
    question: q,
    isDaily: isDaily,
    duel: duelCtx || null,
    mode: (opts && opts.mode) || null,
    challengeId: (opts && opts.challengeId) || null,
    startedAt: Date.now(),
    lives: 5,
    found: new Array(q.answers.length).fill(null),
    foundCount: 0,
    wrongGuesses: new Set(),
    over: false
  };
  renderRound();
}

function renderRound(){
  const rs = roundState;
  const q = rs.question;
  const heartsHtml = Array.from({length:5}).map((_,i)=>
    `<span class="life ${i < rs.lives ? '' : 'lost'}">❤️</span>`
  ).join("");

  const slotsHtml = q.answers.map((ans, i)=>{
    const val = rs.found[i];
    return `<div class="slot ${val ? 'filled':''}">
      <span class="rank">${q.ranked ? (i+1) : '•'}</span>
      <span>${val ? "✅ "+val : '?'}</span>
    </div>`;
  }).join("");

  main.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <span class="badge ${q.difficulty}">${LEVEL_ICON[q.difficulty]||''} ${q.difficulty}</span>
        <div class="lives">${heartsHtml}</div>
      </div>
      ${rs.duel ? `<div class="badge expert" style="margin-top:8px;">⚔️ Player ${rs.duel.player}'s turn</div>` : ''}
      ${rs.mode === 'blitz' ? `<div class="badge expert" style="margin-top:8px;">⚡ Blitz — round ${blitzState.index+1}/${blitzState.ids.length}</div>` : ''}
      ${rs.mode === 'survival' ? `<div class="badge expert" style="margin-top:8px;">🔥 Survival — ${survivalState.cleared} cleared</div>` : ''}
      <div class="round-visual">${getTypeVisual(q)}</div>
      <h2 style="margin-top:10px;">${q.icon || "🌍"} ${q.title}</h2>
      <p class="sub">${q.prompt}</p>
      <div class="progress-bar"><div style="width:${(rs.foundCount/q.answers.length)*100}%"></div></div>
      <div class="slots">${slotsHtml}</div>
      <div class="guess-wrap">
        <form class="guess-row" onsubmit="submitGuess(event)" autocomplete="off">
          <input type="text" id="guessInput" placeholder="🔎 Type a country / answer…" autocomplete="off" autofocus
            oninput="handleTypeahead(this.value)" onblur="hideSuggestionsSoon()" onfocus="handleTypeahead(this.value)">
          <button class="btn btn-primary" type="submit">Guess</button>
        </form>
        <div class="suggestions hidden" id="suggestions"></div>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="hint-row">
        <button class="btn btn-outline btn-block" type="button" onclick="useHint()" ${rs.lives<=1 || rs.foundCount===q.answers.length ? 'disabled':''}>💡 Hint (−1 ❤️)</button>
      </div>
    </div>
    <button class="btn btn-outline btn-block" onclick="quitRound()">🏳️ Give up &amp; reveal answers</button>
  `;
}

function getSuggestionMatches(query){
  const q = (query||"").trim().toLowerCase();
  if(q.length < 1) return [];
  const pool = suggestionPoolFor(roundState && roundState.question);
  return pool.filter(name => name.toLowerCase().startsWith(q)).slice(0,6);
}
function handleTypeahead(value){
  const box = document.getElementById("suggestions");
  if(!box) return;
  const matches = getSuggestionMatches(value);
  if(matches.length === 0){
    box.classList.add("hidden");
    box.innerHTML = "";
    return;
  }
  box.innerHTML = matches.map(m => `<div class="sug-item" onmousedown="selectSuggestion('${m.replace(/'/g,"\\'")}')">${m}</div>`).join("");
  box.classList.remove("hidden");
}
function selectSuggestion(name){
  const input = document.getElementById("guessInput");
  if(!input) return;
  input.value = name;
  hideSuggestions();
  submitGuess(new Event("submit"), true);
}
function hideSuggestions(){
  const box = document.getElementById("suggestions");
  if(box){ box.classList.add("hidden"); box.innerHTML = ""; }
}
function hideSuggestionsSoon(){
  setTimeout(hideSuggestions, 150);
}

function useHint(){
  const rs = roundState;
  if(!rs || rs.over) return;
  if(rs.lives <= 1){ showToast("Not enough lives left for a hint"); return; }
  const remaining = rs.question.answers.map((a,i)=>({a,i})).filter(x=>!rs.found[x.i]);
  if(remaining.length === 0) return;
  const pick = remaining[Math.floor(Math.random()*remaining.length)];
  rs.lives--;
  AudioFX.hint();
  showToast(`💡 Hint: one answer starts with "${pick.a[0].toUpperCase()}"`);
  if(rs.lives <= 0){ finishRound(false); return; }
  renderRound();
}

function submitGuess(e, fromSuggestion){
  if(e && e.preventDefault) e.preventDefault();
  const rs = roundState;
  if(!rs || rs.over) return;
  const input = document.getElementById("guessInput");
  const raw = (input ? input.value : "").trim();
  if(!raw) return;
  const norm = normalize(raw);
  if(input) input.value = "";
  hideSuggestions();

  const q = rs.question;
  let matchedIndex = -1;
  for(let i=0;i<q.answers.length;i++){
    if(rs.found[i]) continue; // already found
    const set = buildAliasSet(q.answers[i]);
    if(set.has(norm)){ matchedIndex = i; break; }
  }
  let fuzzy = false;
  if(matchedIndex === -1){
    const fuzzyIdx = findFuzzyMatch(norm, q, rs.found);
    if(fuzzyIdx !== -1){ matchedIndex = fuzzyIdx; fuzzy = true; }
  }

  const feedback = document.getElementById("feedback");

  if(matchedIndex !== -1){
    rs.found[matchedIndex] = q.answers[matchedIndex];
    rs.foundCount++;
    const POINTS_BY_DIFFICULTY = { easy: 7, medium: 10, hard: 15, expert: 22 };
    addScore(POINTS_BY_DIFFICULTY[q.difficulty] || 7);
    AudioFX.correct();
    feedback.textContent = fuzzy
      ? "🤏 So close — we'll count it! " + q.answers[matchedIndex] + " is on the list."
      : "✅ Correct! " + q.answers[matchedIndex] + " is on the list.";
    feedback.className = "feedback ok";
    saveState();
    if(rs.foundCount === q.answers.length){
      finishRound(true);
      return;
    }
  } else {
    if(rs.wrongGuesses.has(norm)){
      AudioFX.click();
      feedback.textContent = "🤔 You already tried that one.";
      feedback.className = "feedback bad";
    } else {
      rs.wrongGuesses.add(norm);
      rs.lives--;
      AudioFX.wrong();
      feedback.textContent = "❌ Not on the list. Life lost.";
      feedback.className = "feedback bad";
      if(rs.lives <= 0){
        finishRound(false);
        return;
      }
    }
  }
  renderRound();
  document.getElementById("feedback").textContent = feedback.textContent;
  document.getElementById("feedback").className = feedback.className;
}

function quitRound(){
  finishRound(false);
}

function finishRound(completedAll){
  const rs = roundState;
  rs.over = true;
  const q = rs.question;

  if(rs.duel){
    finishDuelLeg(completedAll);
    return;
  }
  // Blitz/Survival are self-contained side challenges, same as Duel — they
  // don't touch the main streak/badge/server-sync pipeline, just like Duel
  // legs don't either.
  if(rs.mode === 'blitz'){ finishBlitzLeg(completedAll); return; }
  if(rs.mode === 'survival'){ finishSurvivalLeg(completedAll); return; }

  const wouldLoseStreak = !completedAll && rs.foundCount < q.answers.length && rs.lives <= 0
    && state.streak > 0 && !state.premium;
  if(wouldLoseStreak){
    renderStreakSaveOffer();
    return; // paused — resumes via saveStreakWithPremium() or declineStreakSave()
  }
  finalizeRound(completedAll, false);
}

function renderStreakSaveOffer(){
  const rs = roundState;
  const q = rs.question;
  main.innerHTML = `
    <div class="card center" style="border-color:var(--red);">
      <h2>💔 About to lose your ${state.streak}-round streak</h2>
      <p class="sub">You found ${rs.foundCount} of ${q.answers.length} this round — not enough to keep it going. Premium's 🛡️ Streak Shield automatically protects your streak the next time this happens.</p>
      <button class="btn btn-gold btn-block" onclick="saveStreakWithPremium()">🛡️ Go Premium &amp; save my streak</button>
      <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="declineStreakSave()">No thanks, reset my streak</button>
    </div>
  `;
}
async function saveStreakWithPremium(){
  if(backendEnabled){
    if(!authSession){
      showToast("👤 Sign in on the Premium screen to subscribe");
      finalizeRound(false, false);
      return;
    }
    // Real payment can't complete instantly — Stripe Checkout is a redirect,
    // not a synchronous call — so this round's streak still resets now.
    // Once Premium is active, the daily Shield auto-protects every streak
    // from here on, which is the honest version of this offer.
    finalizeRound(false, false);
    try{
      const { url } = await apiFetch("/api/checkout", { method: "POST", body: JSON.stringify({ plan: 'monthly' }) });
      window.location.href = url;
    } catch(e){
      showToast("⚠️ " + e.message);
    }
    return;
  }
  // Local demo mode — unchanged simulate behavior, instant.
  activatePremium('monthly', {silent: true});
  state.shieldDate = todayStr();
  showToast("★ Premium activated — streak saved!");
  finalizeRound(false, true);
}
function declineStreakSave(){
  state.streak = 0;
  finalizeRound(false, false);
}

function finalizeRound(completedAll, shieldAlreadyUsed){
  const rs = roundState;
  const q = rs.question;
  let shieldUsed = shieldAlreadyUsed;

  if(completedAll){
    state.streak += 1;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    addScore(25); // completion bonus
    if(STREAK_MILESTONES[state.streak]){
      const bonus = addScore(STREAK_MILESTONES[state.streak]);
      showToast(`🔥 ${state.streak}-round streak! +${bonus} bonus points`);
    }
  } else if(!shieldUsed && rs.foundCount < q.answers.length && rs.lives <= 0){
    if(state.streak > 0 && streakShieldAvailable()){
      state.shieldDate = todayStr();
      shieldUsed = true;
      showToast("🛡️ Streak Shield protected your streak!");
    } else {
      state.streak = 0;
    }
  }
  if(!state.playedIds.includes(q.id)) state.playedIds.push(q.id);

  state.history.unshift({
    questionId: q.id, title: q.title, icon: q.icon, difficulty: q.difficulty,
    foundCount: rs.foundCount, total: q.answers.length, completedAll, date: todayStr()
  });
  if(state.history.length > 200) state.history.length = 200;

  if(rs.isDaily){
    state.dailyDate = todayStr();
    state.dailyQuestionId = q.id;
    state.dailyCompleted = true;
  }
  saveState();
  syncRoundToServer(q, rs, completedAll, shieldUsed);
  completedAll ? AudioFX.win() : AudioFX.lose();

  const revealHtml = q.answers.map((a,i)=>{
    const got = !!rs.found[i];
    return `<div class="slot ${got?'filled':''}">
      <span class="rank">${q.ranked ? (i+1) : '•'}</span><span>${got ? "✅ " : "⬜ "}${a}</span>
    </div>`;
  }).join("");

  const newBadges = getEarnedBadges().filter(b => !(state.seenBadges||[]).includes(b.id));
  if(newBadges.length){
    state.seenBadges = [...(state.seenBadges||[]), ...newBadges.map(b=>b.id)];
    saveState();
  }

  main.innerHTML = `
    <div class="card center">
      <h2>${completedAll ? "🎉 Nailed it!" : "😅 Round over"}</h2>
      <p class="sub">You found ${rs.foundCount} of ${q.answers.length}${completedAll ? "" : " before running out of lives"}.${shieldUsed ? " 🛡️ Your streak was protected." : ""}</p>
      <div class="slots" style="text-align:left;">${revealHtml}</div>
      <div class="fact-box"><b>💡 Did you know?</b> ${q.fact}</div>
      ${newBadges.length ? `<div class="fact-box" style="border-color:var(--gold);background:rgba(251,191,36,.08);"><b>🏅 New badge${newBadges.length>1?'s':''}!</b> ${newBadges.map(b=>b.icon+' '+b.label).join(', ')}</div>` : ''}
      ${backendEnabled && authSession && !rs.duel ? `<div id="roundLeaderboard"></div>` : ''}
      <div class="row" style="margin-top:16px;">
        <button class="btn btn-outline btn-block" onclick="goHome()">🏠 Home</button>
        <button class="btn btn-primary btn-block" onclick="renderLevels()">▶ Play another</button>
      </div>
      <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="shareResult()">📤 Share result</button>
      ${backendEnabled && authSession && !rs.duel ? `<button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="createChallenge()">🥊 Challenge a friend</button>` : ''}
    </div>
  `;
  if(backendEnabled && authSession && !rs.duel) loadRoundLeaderboard(q.id, !!rs.isDaily);
  if(rs.mode === 'challenge' && rs.challengeId){
    submitChallengeResult(rs.challengeId, rs.foundCount, rs.startedAt);
  }
}

/* Opt-in comparison against every other player who's ever completed this
   round — daily or practice. Fetches only derived numbers (rank/percentile/
   total) from the server, never other players' raw data, so this stays
   privacy-safe. */
async function loadRoundLeaderboard(questionId, isDaily){
  const box = document.getElementById("roundLeaderboard");
  if(!box) return;
  try{
    const stats = await apiFetch("/api/round-leaderboard?questionId=" + questionId, { method: "GET" });
    if(!stats || stats.totalPlayers < 2){ return; } // not enough players yet for a meaningful comparison
    box.innerHTML = `
      <div class="fact-box" style="border-color:var(--accent);">
        <b>📊 ${isDaily ? "Today's daily question" : "This round"}</b><br>
        You beat <b style="color:#e2e8f0">${stats.beatPercent}%</b> of the ${stats.totalPlayers} players who've played it (rank #${stats.rank}).
      </div>`;
  } catch(e){ /* leaderboard is a nice-to-have; fail silently if unreachable */ }
}

async function syncRoundToServer(q, rs, completedAll, shieldUsed){
  if(!backendEnabled || !authSession) return;
  try{
    const { profile, milestoneBonus } = await apiFetch("/api/finish-round", {
      method: "POST",
      body: JSON.stringify({
        questionId: q.id,
        foundCount: rs.foundCount,
        completedAll,
        isDaily: !!rs.isDaily,
        useShield: shieldUsed
      })
    });
    applyServerProfile(profile);
    if(milestoneBonus) showToast(`🔥 Synced — +${milestoneBonus} streak bonus points`);
  } catch(e){
    // Offline, backend not deployed yet, or a server-side gate (e.g. practice cap) —
    // local score for this round already stands, so just surface real rejections.
    if(e.status === 403) showToast("⚠️ " + e.message);
  }
}

function shareResult(){
  const rs = roundState;
  if(!rs) return;
  const q = rs.question;
  const grid = q.answers.map((a,i)=> rs.found[i] ? "🟩" : "⬜").join("");
  const text = `Top 10 Geo ${q.icon || "🌍"} ${q.title}\n${grid} ${rs.foundCount}/${q.answers.length}\n🔥 Streak: ${state.streak}`;
  AudioFX.click();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>showToast("📋 Result copied to clipboard!"))
      .catch(()=>showToast("Copy failed — screenshot instead?"));
  } else {
    showToast("📋 " + text.replace(/\n/g," · "));
  }
}

/* =========================================================
   CHALLENGE A FRIEND (async, real backend required)
   Play a round, generate a shareable link, a friend opens it
   on their own device/time, plays the identical round, and
   both sides see a head-to-head comparison. Unlike Duel Mode
   this genuinely crosses devices/accounts — it needs the real
   backend (a signed-in account on both ends) since there's no
   other way to carry a result between two different browsers.
   ========================================================= */
async function createChallenge(){
  const rs = roundState;
  if(!rs || !backendEnabled || !authSession) return;
  try{
    const elapsedMs = Date.now() - rs.startedAt;
    const { challengeId } = await apiFetch("/api/create-challenge", {
      method: "POST",
      body: JSON.stringify({ questionId: rs.question.id, foundCount: rs.foundCount, elapsedMs })
    });
    const url = window.location.origin + window.location.pathname + "?challenge=" + challengeId;
    AudioFX.click();
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url)
        .then(()=>showToast("🔗 Challenge link copied — send it to a friend!"))
        .catch(()=>showToast("🔗 Challenge link: " + url));
    } else {
      showToast("🔗 Challenge link: " + url);
    }
  } catch(e){
    showToast("⚠️ " + e.message);
  }
}
async function submitChallengeResult(challengeId, foundCount, startedAt){
  try{
    const elapsedMs = Date.now() - startedAt;
    const { challenge } = await apiFetch("/api/accept-challenge", {
      method: "POST",
      body: JSON.stringify({ challengeId, foundCount, elapsedMs })
    });
    renderChallengeResult(challenge);
  } catch(e){
    showToast("⚠️ Couldn't submit challenge result: " + e.message);
  }
}
function renderChallengeResult(challenge){
  const mine = { found: challenge.opponentFoundCount, elapsed: challenge.opponentElapsedMs };
  const theirs = { found: challenge.creatorFoundCount, elapsed: challenge.creatorElapsedMs };
  let winner = null;
  if(mine.found !== theirs.found) winner = mine.found > theirs.found ? 'you' : 'them';
  else if(mine.elapsed !== theirs.elapsed) winner = mine.elapsed < theirs.elapsed ? 'you' : 'them';
  const fmtTime = ms => (ms/1000).toFixed(1) + "s";
  main.innerHTML = `
    <div class="card center">
      <h2>🥊 Challenge Results</h2>
      <div class="row" style="margin:16px 0;">
        <div class="duel-card ${winner==='you'?'winner':''}">
          <div>${winner==='you'?'🏆 ':''}You</div>
          <div class="duel-score">${mine.found}/${challenge.total}</div>
          <div style="color:var(--text-dim);font-size:12px;">⏱️ ${fmtTime(mine.elapsed)}</div>
        </div>
        <div class="duel-card ${winner==='them'?'winner':''}">
          <div>${winner==='them'?'🏆 ':''}Them</div>
          <div class="duel-score">${theirs.found}/${challenge.total}</div>
          <div style="color:var(--text-dim);font-size:12px;">⏱️ ${fmtTime(theirs.elapsed)}</div>
        </div>
      </div>
      ${winner ? '' : '<p class="sub">🤝 Perfect tie — even on speed!</p>'}
      <button class="btn btn-primary btn-block" onclick="goHome()">🏠 Home</button>
    </div>
  `;
}
async function renderChallengeLanding(challengeId){
  if(!backendEnabled){
    main.innerHTML = `<div class="card center"><h2>🥊 Challenge links need the real backend</h2><p class="sub">This preview copy of the site isn't connected to an account system, so challenge links can't be compared across devices here.</p><button class="btn btn-outline btn-block" onclick="goHome()">🏠 Home</button></div>`;
    return;
  }
  if(!authSession){
    main.innerHTML = `
      <div class="card center">
        <h2>🥊 You've been challenged!</h2>
        <p class="sub">Sign in to see the challenge and play — it only takes a magic link, no password.</p>
        <input id="authEmail" type="email" placeholder="you@example.com" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border,#334155);background:var(--bg-soft);color:inherit;margin-bottom:10px;">
        <button class="btn btn-primary btn-block" onclick="sendMagicLink(document.getElementById('authEmail').value.trim())">Send sign-in link</button>
      </div>`;
    return;
  }
  try{
    const { challenge } = await apiFetch("/api/challenge?id=" + challengeId, { method: "GET" });
    if(challenge.isCreator){
      main.innerHTML = `<div class="card center"><h2>🥊 That's your own challenge!</h2><p class="sub">Send this link to a friend instead — you can't accept your own.</p><button class="btn btn-outline btn-block" onclick="goHome()">🏠 Home</button></div>`;
      return;
    }
    if(challenge.alreadyAccepted){
      main.innerHTML = `<div class="card center"><h2>🥊 Challenge already settled</h2><p class="sub">Someone already accepted this one — ask for a fresh link if you want a rematch.</p><button class="btn btn-outline btn-block" onclick="goHome()">🏠 Home</button></div>`;
      return;
    }
    const q = challenge.question;
    main.innerHTML = `
      <div class="card center">
        <h2>🥊 You've been challenged!</h2>
        <span class="badge ${q.difficulty}">${LEVEL_ICON[q.difficulty]||''} ${q.difficulty}</span>
        <p class="sub" style="margin-top:10px;">They found <b style="color:#e2e8f0">${challenge.creatorFoundCount}/${challenge.creatorTotal}</b> in ${(challenge.creatorElapsedMs/1000).toFixed(1)}s. Same round, same rules — think you can beat them?</p>
        <button class="btn btn-primary btn-block" onclick="startRound(${q.id}, false, null, {mode:'challenge', challengeId:${challenge.id}})">▶ Accept &amp; Play</button>
        <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="goHome()">Not now</button>
      </div>`;
  } catch(e){
    main.innerHTML = `<div class="card center"><h2>🥊 Couldn't load that challenge</h2><p class="sub">${e.message}</p><button class="btn btn-outline btn-block" onclick="goHome()">🏠 Home</button></div>`;
  }
}

function resolveCountryGuess(input){
  const raw = String(input || "").trim();
  if(!raw) return null;
  const norm = normalize(raw);
  const direct = COUNTRIES.find(c => normalize(c.name) === norm);
  if(direct) return direct;
  const aliasTarget = COUNTRY_ALIASES[raw.toLowerCase().trim()];
  if(aliasTarget) return COUNTRIES.find(c => c.name === aliasTarget) || null;
  return null;
}
function countryDayIndex(){
  const d = new Date();
  const utcMidnight = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  return Math.floor(utcMidnight / 86400000);
}
function getDailyCountry(){
  return COUNTRIES[countryDayIndex() % COUNTRIES.length];
}

function rotatingStatForToday(){

function bearingDirection(lat1, lon1, lat2, lon2){
  const toRad = d => d * Math.PI / 180;
  const phi1 = toRad(lat1), phi2 = toRad(lat2), dLon = toRad(lon2 - lon1);
  const y = Math.sin(dLon) * Math.cos(phi2);
  const x = Math.cos(phi1) * Math.sin(phi2) - Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLon);
  const brng = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  const dirs = ["N","NE","E","SE","S","SW","W","NW"];
  return dirs[Math.round(brng / 45) % 8];
}

function computeCountryGuessResult(guess, answer, stat){
  const correct = guess.id === answer.id;
  return {
    name: guess.name,
    correct,
    continentMatch: guess.continent === answer.continent,
    size: correct ? "equal" : (guess.area < answer.area ? "bigger" : "smaller"),
    population: correct ? "equal" : (guess.population < answer.population ? "more" : "fewer"),
    direction: correct ? null : bearingDirection(guess.lat, guess.lon, answer.lat, answer.lon),
    statHigher: correct ? "equal" : (guess[stat.key] < answer[stat.key] ? "higher" : "lower")
  };
}

      isDaily: true,
      stat
    });
    return;
  }

  main.innerHTML = `
    <div class="card center">
      <h2>🌎 Guess the Country</h2>
      <p class="sub">A new mystery country every day. 6 guesses — after each one you'll learn whether you're on the right continent, whether the real country is bigger/smaller and more/less populous, which direction to head, and how it compares on ${stat.label}.</p>
      <button class="btn btn-primary btn-block" onclick="startCountryGame(true)">${playedToday ? "▶ Continue today's puzzle" : "▶ Play today's puzzle"}</button>
      ${state.premium
        ? `<button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="startCountryGame(false)">🧪 Practice (random country)</button>`
        : `<p class="sub" style="margin-top:10px;">🔒 Unlimited practice puzzles (random countries, doesn't touch today's daily) are a Premium perk. <a href="javascript:void(0)" onclick="renderPremium()" style="color:var(--accent);">See plans →</a></p>`}
      ${state.countryPracticeSolved ? `<p class="sub" style="margin-top:8px;font-size:12px;">🧪 Practice puzzles solved: ${state.countryPracticeSolved}</p>` : ''}
    </div>
    <button class="btn btn-outline btn-block" onclick="goHome()">← Back home</button>
  `;
}

function startCountryGame(isDaily){
  const todayIdx = countryDayIndex();
  if(isDaily){
    const persisted = state.countryGame;
    if(persisted && persisted.dayIndex === todayIdx && (persisted.solved || persisted.failed)){
      renderCountryGame();
      return;
    }
    const resumedGuesses = (persisted && persisted.dayIndex === todayIdx) ? persisted.guesses : [];
    countryGameState = {
      answer: getDailyCountry(), guesses: resumedGuesses, isDaily: true,
      dayIndex: todayIdx, stat: rotatingStatForToday(), solved: false, failed: false
    };
  } else {
    if(!state.premium){ renderPremium(); return; }
    const dailyIdx = todayIdx % COUNTRIES.length;
    let idx = dailyIdx;
    if(COUNTRIES.length > 1){
      while(idx === dailyIdx) idx = Math.floor(Math.random() * COUNTRIES.length);
    }
    countryGameState = {
      answer: COUNTRIES[idx], guesses: [], isDaily: false,
      dayIndex: todayIdx, stat: rotatingStatForToday(), solved: false, failed: false
    };
  }
  AudioFX.click();
  renderCountryRound();
}

function renderCountryRound(){
  const cs = countryGameState;
  if(!cs){ renderCountryGame(); return; }
  const dotsHtml = Array.from({length:6}).map((_,i)=>`<span class="cg-dot ${i < cs.guesses.length ? 'used' : ''}"></span>`).join("");
  const guessesHtml = cs.guesses.map(g => renderCountryGuessRow(g, cs.stat)).join("");
  main.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;">
        <span class="badge ${cs.isDaily ? 'expert' : 'medium'}">${cs.isDaily ? '🌎 Daily puzzle' : '🧪 Practice'}</span>
        <span style="color:var(--text-dim);font-size:12px;">${cs.guesses.length}/6 guesses</span>
      </div>
      <div class="cg-dots">${dotsHtml}</div>
      <div id="cgGuesses">${guessesHtml}</div>
      <div class="guess-wrap">
        <form class="guess-row" onsubmit="submitCountryGuess(event)" autocomplete="off">
          <input type="text" id="cgInput" placeholder="🔎 Type a country…" autocomplete="off" autofocus
            oninput="handleCountryTypeahead(this.value)" onblur="hideCgSuggestionsSoon()" onfocus="handleCountryTypeahead(this.value)">
          <button class="btn btn-primary" type="submit">Guess</button>
        </form>
        <div class="suggestions hidden" id="cgSuggestions"></div>
      </div>
    </div>
    <button class="btn btn-outline btn-block" onclick="quitCountryGame()">🏳️ Give up &amp; reveal</button>
  `;
}

function renderCountryGuessRow(g, stat){
  const dirChip = g.correct ? '' : `<span class="cg-chip">🧭 Head ${g.direction} ${DIR_ARROWS[g.direction] || ''}</span>`;
  const statIcon = stat.key === 'hdi' ? '📊' : '💰';
  return `<div class="cg-guess ${g.correct ? 'correct' : ''}">
    <div class="cg-name">${g.correct ? '🎉 ' : ''}${g.name}</div>
    <div class="cg-chips">
      <span class="cg-chip ${g.continentMatch ? 'good' : 'bad'}">${g.continentMatch ? '✅ Right continent!' : '❌ Wrong continent'}</span>
      ${g.correct ? '' : `<span class="cg-chip">📏 Go ${g.size === 'bigger' ? 'BIGGER ⬆️' : 'SMALLER ⬇️'}</span>`}
      ${g.correct ? '' : `<span class="cg-chip">👥 ${g.population === 'more' ? 'MORE people ⬆️' : 'FEWER people ⬇️'}</span>`}
      ${dirChip}
      ${g.correct ? '' : `<span class="cg-chip">${statIcon} ${stat.label}: ${g.statHigher === 'higher' ? 'HIGHER ⬆️' : 'LOWER ⬇️'}</span>`}
    </div>
  </div>`;
}

function getCountrySuggestionMatches(query){
  const q = (query || "").trim().toLowerCase();
  if(q.length < 1) return [];
  const guessedNames = new Set((countryGameState ? countryGameState.guesses : []).map(g => g.name));
  return COUNTRIES.map(c => c.name).filter(name => name.toLowerCase().startsWith(q) && !guessedNames.has(name)).slice(0, 6);
}
function handleCountryTypeahead(value){
  const box = document.getElementById("cgSuggestions");
  if(!box) return;
  const matches = getCountrySuggestionMatches(value);
  if(matches.length === 0){ box.classList.add("hidden"); box.innerHTML = ""; return; }
  box.innerHTML = matches.map(m => `<div class="sug-item" onmousedown="selectCountrySuggestion('${m.replace(/'/g,"\\'")}')">${m}</div>`).join("");
  box.classList.remove("hidden");
}
function selectCountrySuggestion(name){
  const input = document.getElementById("cgInput");
  if(!input) return;
  input.value = name;
  hideCgSuggestions();
  submitCountryGuess(new Event("submit"));
}
function hideCgSuggestions(){
  const box = document.getElementById("cgSuggestions");
  if(box){ box.classList.add("hidden"); box.innerHTML = ""; }
}
function hideCgSuggestionsSoon(){ setTimeout(hideCgSuggestions, 150); }

function submitCountryGuess(e){
  if(e && e.preventDefault) e.preventDefault();
  const cs = countryGameState;
  if(!cs || cs.solved || cs.failed) return;
  const input = document.getElementById("cgInput");
  const raw = input ? input.value : "";
  const guess = resolveCountryGuess(raw);
  if(!guess){
    showToast("🌎 Not a recognized country name");
    return;
  }
  if(cs.guesses.some(g => g.name === guess.name)){
    showToast("Already guessed that one");
    return;
  }
  const result = computeCountryGuessResult(guess, cs.answer, cs.stat);
  cs.guesses.push(result);
  if(input) input.value = "";
  hideCgSuggestions();
  if(result.correct){
    cs.solved = true;
    AudioFX.win();
    finishCountryGame();
    return;
  }
  AudioFX.wrong();
  if(cs.guesses.length >= 6){
    cs.failed = true;
    AudioFX.lose();
    finishCountryGame();
    return;
  }
  if(cs.isDaily) persistCountryGame();
  renderCountryRound();
}

function persistCountryGame(){
  const cs = countryGameState;
  if(!cs || !cs.isDaily) return;
  state.countryGame = { dayIndex: cs.dayIndex, guesses: cs.guesses, solved: cs.solved, failed: cs.failed };
  saveState();
}

/* Deliberately does NOT call addScore()/touch state.score — same reasoning
   as Blitz/Survival: score only syncs to the real backend through the
   server-authoritative /api/finish-round flow, so any other code path that
   bumps it locally risks a silent desync (a signed-in player's earned points
   vanishing the next time syncProfileFromServer() pulls the server's
   unaware value back down). This mode stays a self-contained, locally
   tracked side activity — solving it is its own reward, plus the share grid. */
function finishCountryGame(){
  const cs = countryGameState;
  if(cs.isDaily){
    persistCountryGame();
    if(cs.solved) showToast(`🎉 Solved in ${cs.guesses.length}/6!`);
  } else if(cs.solved){
    state.countryPracticeSolved = (state.countryPracticeSolved || 0) + 1;
    saveState();
    showToast(`🎉 Practice solved in ${cs.guesses.length}/6!`);
  }
  renderCountryResult({ guesses: cs.guesses, answer: cs.answer, solved: cs.solved, isDaily: cs.isDaily, stat: cs.stat });
}

function quitCountryGame(){
  const cs = countryGameState;
  if(!cs){ renderCountryGame(); return; }
  cs.failed = true;
  AudioFX.click();
  finishCountryGame();
}

function renderCountryResult(ctx){
  const { guesses, answer, solved, isDaily, stat } = ctx;
  const guessesHtml = guesses.map(g => renderCountryGuessRow(g, stat)).join("");
  main.innerHTML = `
    <div class="card center" style="border-color:${solved ? 'var(--green)' : 'var(--red)'};border-width:2px;">
      <div style="font-size:44px;line-height:1;">${solved ? '🎉' : '💔'}</div>
      <h2 style="color:${solved ? 'var(--green)' : 'var(--red)'};font-size:24px;margin-top:6px;">${solved ? 'Solved!' : 'Out of guesses'}</h2>
      <p class="sub">The answer was <b style="color:#e2e8f0">${answer.name}</b> (${answer.continent}, capital ${answer.capital}).</p>
    </div>
    <div class="card">${guessesHtml || '<p class="sub">No guesses made.</p>'}</div>
    <button class="btn btn-primary btn-block" onclick="shareCountryResult(${!!solved}, ${guesses.length}, ${!!isDaily})">📤 Share result</button>
    ${isDaily ? `<p class="sub" style="text-align:center;margin-top:10px;">Come back tomorrow for a new country${state.premium ? ', or practice with a random one right now.' : '.'}</p>` : ''}
    ${!isDaily ? `<button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="startCountryGame(false)">🧪 Another practice puzzle</button>` : ''}
    ${isDaily && state.premium ? `<button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="startCountryGame(false)">🧪 Practice (random country)</button>` : ''}
    <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="goHome()">🏠 Home</button>
  `;
}

function shareCountryResult(solved, count, isDaily){
  const grid = Array.from({length:6}).map((_,i)=> i < count ? (i === count - 1 && solved ? "🟩" : "🟨") : "⬜").join("");
  const text = `🌎 Guess the Country ${isDaily ? '#' + countryDayIndex() : '(practice)'}\n${grid} ${solved ? count + '/6' : 'X/6'}`;
  AudioFX.click();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>showToast("📋 Result copied to clipboard!"))
      .catch(()=>showToast("Copy failed — screenshot instead?"));
  } else {
    showToast("📋 " + text.replace(/\n/g, " · "));
  }
}


/* =========================================================
   GEO-BINGO
   Mechanic researched from playfootball.games' Football Bingo
   (search summary, Aug 2026): a random subject appears one at a
   time; you pick exactly ONE still-open square on a 4x4 card that
   correctly describes it — no retries on that subject, right or
   wrong you move to the next one. The round ends when you complete
   a bingo line (row/column/diagonal) or the subject pool runs out
   first. Adapted here to geography: subjects are countries and
   cities, squares are geographic/political facts.

   DATA NOTES: like the trivia and country-guess datasets, this
   uses a curated pool (not all 197 countries) of well-known
   countries/cities specifically because the category facts below
   (border lists, EU/eurozone/G7/G20 membership, official languages,
   which sea a city touches) are hand-compiled from general
   knowledge for accuracy on THIS pool, not verified against a live
   source — same "best effort, recommend a pre-launch spot-check"
   caveat as elsewhere. City population figures are metro-area
   approximations, not city-proper figures, chosen to make the
   "over 10 million" category unambiguous either way.
   ========================================================= */

// ---- static category-membership lists (stable geographic/political facts) ----
const GB_BORDERS_CHINA = ["Russia","India","Pakistan","Mongolia","North Korea","Vietnam","Myanmar","Kazakhstan","Kyrgyzstan","Tajikistan","Nepal","Bhutan"];

const GB_ISLAND_NATION = ["Japan","United Kingdom","Indonesia","New Zealand","Sri Lanka","Iceland","Ireland","Philippines","Madagascar","Cuba","Malta","Singapore"];
const GB_CROSSES_EQUATOR = ["Brazil","Indonesia","Kenya","Ecuador","Colombia","DR Congo","Uganda","Somalia","Gabon"];

const GB_G20 = GB_G7.concat(["China","India","Russia","Brazil","Australia","South Korea","Indonesia","Saudi Arabia","Turkey","Mexico","South Africa","Argentina"]);

// ---- curated country pool (must be names present in COUNTRIES) ----
const GEOBINGO_COUNTRY_POOL = [
  "Egypt","Nigeria","South Africa","Kenya","Morocco","Ethiopia",
  "China","India","Japan","Russia","Saudi Arabia","Indonesia","Turkey","Pakistan","South Korea","Thailand","Vietnam","Israel",

  "Brazil","Argentina","Chile","Peru","Colombia",
  "Australia","New Zealand"
];

// ---- curated city pool (population = metro-area approximation) ----
const GEOBINGO_CITIES = [
  { name:"Cairo", country:"Egypt", isCapital:true, population:21000000, lat:30.0, sea:null, river:"Nile" },
  { name:"Alexandria", country:"Egypt", isCapital:false, population:5200000, lat:31.2, sea:"Mediterranean", river:null },

  { name:"Moscow", country:"Russia", isCapital:true, population:12600000, lat:55.75, sea:null, river:"Moskva" },
  { name:"Mumbai", country:"India", isCapital:false, population:21000000, lat:19.1, sea:"Indian", river:null },

  { name:"Dubai", country:"United Arab Emirates", isCapital:false, population:3500000, lat:25.2, sea:"Indian", river:null },
